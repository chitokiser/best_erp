<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자재 상세 - BEST MATERIAL</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .price-box {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-public {
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
        }

        .price-market {
            background-color: #e0f2fe;
            border: 1px solid #bae6fd;
        }

        .price-best {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
        }

        .price-sell {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
        }

        @media (max-width: 768px) {
            .detail-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Image modal */
        #imgModal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        #imgModal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        #imgModal .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body style="display: none;">
    <header class="main-header">
        <div class="container">
            <h1 class="logo" style="margin-bottom: 0.5rem;"><a href="index.html">BEST MATERIAL DATA</a></h1>
            <nav class="main-nav">
                <ul>
                    <li><a href="materials.html" style="color:var(--primary-color)">자재 DB</a></li>
                    <li><a href="price-comparison.html">가격 비교</a></li>
                    <li><a href="suppliers.html">공급업체</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Modal for Image Zoom -->
    <div id="imgModal" onclick="this.style.display='none'">
        <span class="close-btn">&times;</span>
        <img id="imgModalContent" src="" alt="Zoomed Image">
    </div>

    <main class="container" style="padding: 2rem 1rem;" id="mainContent">
        <p>로딩 중...</p>
    </main>

    <script type="module">
        import { getMaterialById, getSupplierPrices } from './services/materialApi.js';

        const mainContent = document.getElementById('mainContent');
        const urlParams = new URLSearchParams(window.location.search);
        const materialId = urlParams.get('id');

        const loadMaterial = async () => {
            if (!materialId) {
                mainContent.innerHTML = '<p>자재 ID가 제공되지 않았습니다.</p>';
                return;
            }
            try {
                const m = await getMaterialById(materialId);
                if (!m) {
                    mainContent.innerHTML = '<p>자재를 찾을 수 없습니다.</p>';
                    return;
                }

                const imgUrl = (m.images && m.images.length > 0) ? m.images[0] : 'https://placehold.co//e2e8f0/475569?text=No+Image';

                mainContent.innerHTML = `
                    <div style="margin-bottom: 1rem;">
                        <a href="materials.html" style="color: var(--primary-color); font-weight: 500;">&larr; 목록으로 돌아가기</a>
                    </div>
                    
                    <div class="detail-grid">
                        <!-- Left: Images and Info -->
                        <div>
                            <img src="${imgUrl}" alt="${m.name}" style="width: 100%; border-radius: 8px; margin-bottom: 1rem; border: 1px solid var(--border-color); cursor: pointer;" onclick="document.getElementById('imgModalContent').src=this.src; document.getElementById('imgModal').style.display='flex';">
                            
                            <div class="card">
                                <h3>기본 정보</h3>
                                <table style="width: 100%; margin-top: 1rem; text-align: left; border-collapse: collapse;">
                                    <tr><th style="padding: 0.5rem; border-bottom: 1px solid #eee; width: 30%;">자재코드</th><td style="padding: 0.5rem; border-bottom: 1px solid #eee;">${m.materialCode || '-'}</td></tr>
                                    <tr><th style="padding: 0.5rem; border-bottom: 1px solid #eee;">카테고리</th><td style="padding: 0.5rem; border-bottom: 1px solid #eee;">${m.categoryId || '-'} > ${m.subCategoryId || '-'}</td></tr>
                                    <tr><th style="padding: 0.5rem; border-bottom: 1px solid #eee;">브랜드</th><td style="padding: 0.5rem; border-bottom: 1px solid #eee;">${m.brand || '-'}</td></tr>
                                    <tr><th style="padding: 0.5rem; border-bottom: 1px solid #eee;">모델명</th><td style="padding: 0.5rem; border-bottom: 1px solid #eee;">${m.model || '-'}</td></tr>
                                    <tr><th style="padding: 0.5rem; border-bottom: 1px solid #eee;">규격</th><td style="padding: 0.5rem; border-bottom: 1px solid #eee;">${m.specification || '-'}</td></tr>
                                    <tr><th style="padding: 0.5rem; border-bottom: 1px solid #eee;">단위</th><td style="padding: 0.5rem; border-bottom: 1px solid #eee;">${m.unit || '-'}</td></tr>
                                    <tr><th style="padding: 0.5rem; border-bottom: 1px solid #eee;">용도</th><td style="padding: 0.5rem; border-bottom: 1px solid #eee;">${m.applications ? m.applications.join(', ') : '-'}</td></tr>
                                </table>
                            </div>
                        </div>

                        <!-- Right: Pricing -->
                        <div>
                            <h2 style="margin-bottom: 0.5rem; font-size: 2rem;">${m.name}</h2>
                            <p style="color: var(--text-secondary); margin-bottom: 2rem;">${m.nameVi || ''} | ${m.nameEn || ''}</p>

                            <h3 style="margin-bottom: 1rem;">가격 정보</h3>
                            
                            <!-- 출처별 가격 표시 -->
                            <div class="price-box price-public">
                                <div>
                                    <span style="font-size: 0.875rem; color: #475569;">공공가격</span><br>
                                    <small style="color: #64748b;">출처: BXD (예시) | 최근 업데이트: 2026-09</small>
                                </div>
                                <div style="text-align: right; font-weight: bold; font-size: 1.25rem;">
                                    850,000 VND
                                </div>
                            </div>
                            
                            <div class="price-box price-market">
                                <div>
                                    <span style="font-size: 0.875rem; color: #0284c7;">시장가격</span><br>
                                    <small style="color: #38bdf8;">출처: Vatgia (예시) | 최근 업데이트: 2026-09</small>
                                </div>
                                <div style="text-align: right; font-weight: bold; font-size: 1.25rem; color: #0284c7;">
                                    820,000 VND
                                </div>
                            </div>

                            <div class="price-box price-best">
                                <div>
                                    <span style="font-weight: 600; color: var(--primary-color);">BEST 매입가격</span><br>
                                    <small style="color: #60a5fa;">VAT ${m.vatIncluded ? '포함' : '별도'}</small>
                                </div>
                                <div style="text-align: right; font-weight: bold; font-size: 1.5rem; color: var(--primary-color);">
                                    ${m.ourPurchasePrice ? m.ourPurchasePrice.toLocaleString() : '0'} VND
                                </div>
                            </div>

                            <div class="price-box price-sell">
                                <div>
                                    <span style="font-weight: 600; color: #b91c1c;">BEST 판매가격 (예상)</span><br>
                                    <small style="color: #f87171;">VAT ${m.vatIncluded ? '포함' : '별도'}</small>
                                </div>
                                <div style="text-align: right; font-weight: bold; font-size: 1.5rem; color: #b91c1c;">
                                    ${m.ourSellingPrice ? m.ourSellingPrice.toLocaleString() : '0'} VND
                                </div>
                            </div>
                            
                            <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                                <button class="btn-primary" style="flex: 1; padding: 1rem;" onclick="addToRequestCart('${m.id}', '${m.name.replace(/'/g, "\\'")}', ${m.ourPurchasePrice || 0})">
                                    🛒 기안서(장바구니) 담기
                                </button>
                                <button class="btn-primary" style="background:#64748b; flex: 1; padding: 1rem;" onclick="location.href='request-form.html'">
                                    기안/결재 올리기
                                </button>
                            </div>

                            <div style="margin-top: 2rem;">
                                <h3>상세 설명</h3>
                                <p style="margin-top: 0.5rem; color: var(--text-secondary); white-space: pre-wrap;">${m.description || '등록된 설명이 없습니다.'}</p>
                            </div>

                            <div style="margin-top: 2rem;">
                                <h3>연결된 공급처 정보</h3>
                                <div id="supplierInfoBox" style="margin-top: 0.5rem;">
                                    <p style="color: var(--text-secondary); font-size: 0.875rem;">공급처 분석 중...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                // Add To Cart global function
                window.addToRequestCart = (id, name, price) => {
                    let cart = JSON.parse(localStorage.getItem('purchaseCart') || '[]');
                    const existing = cart.find(item => item.id === id);
                    if (existing) {
                        existing.qty += 1;
                    } else {
                        cart.push({ id, name, price, qty: 1 });
                    }
                    localStorage.setItem('purchaseCart', JSON.stringify(cart));

                    // Update header counter
                    const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
                    document.getElementById('cartCount').innerText = totalQty;

                    // Add quick visual feedback
                    alert(`[${name}] 자재가 구매요청 장바구니에 담겼습니다.`);
                };

                // Initialize cart count on load
                const currentCart = JSON.parse(localStorage.getItem('purchaseCart') || '[]');
                const initialQty = currentCart.reduce((sum, item) => sum + item.qty, 0);
                document.getElementById('cartCount').innerText = initialQty;

                // Load real suppliers asynchronously
                setTimeout(async () => {
                    const supBox = document.getElementById('supplierInfoBox');
                    const supps = await getSupplierPrices(materialId); // Using the expanded mock for now
                    if (supps && supps.length > 0) {
                        let html = '<ul style="list-style:none; padding:0; margin:0;">';
                        supps.forEach(s => {
                            html += `
                            <li style="border: 1px solid var(--border-color); padding: 1rem; border-radius: 8px; margin-bottom: 0.5rem; display:flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <strong style="color: var(--text-primary); font-size: 1.1rem;">${s.supplierName || '업체명'}</strong>
                                    <div style="color: var(--text-secondary); font-size: 0.8rem; margin-top:0.25rem;">최근 견적가: ${s.price ? s.price.toLocaleString() : '-'} VND</div>
                                </div>
                                <button class="btn-primary" style="padding: 0.5rem 1rem; font-size:0.875rem;" onclick="location.href='suppliers.html'">업체 문의</button>
                            </li>
                          `;
                        });
                        html += '</ul>';
                        supBox.innerHTML = html;
                    } else {
                        supBox.innerHTML = '<p style="color: var(--text-secondary); font-size: 0.875rem;">등록된 공급처가 없습니다.</p>';
                    }
                }, 500);

            } catch (error) {
                console.error(error);
                mainContent.innerHTML = '<p style="color:red;">자재 정보를 불러오는 중 오류가 발생했습니다.</p>';
            }
        };

        loadMaterial();
    </script>

    <!-- Global Auth Guard -->
    <script type="module">
        import { checkAdminAuth } from './assets/js/auth.js';

        checkAdminAuth(
            (user) => {
                document.body.style.display = 'block';

                // Add logout button / User email to header dynamically if header exists
                const nav = document.querySelector('.main-nav ul');
                if (nav && !document.getElementById('navUserEmail')) {
                    const li = document.createElement('li');
                    li.id = 'navUserEmail';
                    li.innerHTML = `<span style="margin-left: 1rem; font-size:0.875rem; color:var(--text-secondary);">${user.email}</span>
                                    <button onclick="window.logoutAndRedirect()" style="margin-left:0.5rem; background:none; border:none; cursor:pointer; color:var(--primary-color); font-weight:bold;">[로그아웃]</button>`;
                    nav.appendChild(li);
                }
            },
            () => {
                const current = window.location.pathname + window.location.search;
                window.location.href = 'login.html?redirect=' + encodeURIComponent(current);
            }
        );

        import { logoutAdmin } from './assets/js/auth.js';
        window.logoutAndRedirect = () => {
            logoutAdmin();
            window.location.href = 'login.html';
        };
    </script>
</body>

</html>
