<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매장 방문 행운의 룰렛 이벤트</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/index.css">
    <style>
        body { background: #1e293b; color: #fff; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding:1.5rem; }
        .roulette-container {
            width: 100%; max-width: 350px; background: #334155; border-radius: 2rem; padding: 2rem 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 0 40px rgba(79,70,229,0.5); border: 2px solid #4F46E5;
            position: relative; overflow: hidden;
        }
        .title { font-size: 1.8rem; font-weight: 800; color: #fbbf24; margin-bottom: 0.5rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .subtitle { font-size: 0.95rem; color: #94a3b8; margin-bottom: 2rem; }
        .slot-machine {
            background: #0f172a; border-radius: 1rem; padding: 1.5rem; margin-bottom: 2rem;
            border: 4px solid #475569; position: relative;
        }
        .slot-number { font-size: 4rem; font-family: monospace; font-weight: 800; letter-spacing: 4px; color: #10b981; }
        .btn-spin {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); width: 100%; padding: 1.25rem; font-size: 1.25rem;
            font-weight: 800; color: #78350f; border: none; border-radius: 1rem; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2), inset 0 2px 0 rgba(255,255,255,0.4); transition: transform 0.1s;
        }
        .btn-spin:active { transform: scale(0.95); box-shadow: inset 0 4px 6px rgba(0,0,0,0.4); }
        .btn-spin:disabled { opacity: 0.5; pointer-events: none; }
        
        #resultMsg { font-size: 1.2rem; font-weight: 800; margin-top: 1rem; min-height: 1.5rem; color: #fbbf24; }
    </style>
</head>
<body>
    <div style="margin-bottom: 2rem;">
        <h2 style="color:#fff; margin:0;" id="storeName">가맹점 이벤트</h2>
        <span style="background: rgba(255,255,255,0.1); padding: 0.25rem 0.75rem; border-radius:1rem; font-size:0.8rem;">로그인 됨: <span id="userEmail">...</span></span>
    </div>

    <div class="roulette-container">
        <h1 class="title">🎰 행운의 잭팟</h1>
        <p class="subtitle">매장 방문을 100% 리워드로 돌려받으세요!</p>
        
        <div class="slot-machine">
            <div class="slot-number" id="slotDisplay">0000</div>
        </div>
        
        <button class="btn-spin" id="btnSpin">지금 스핀하기</button>
        <p id="resultMsg"></p>
    </div>

    <script type="module" src="assets/js/firebase-config.js"></script>
    <script type="module">
        import { db, auth } from './assets/js/firebase-config.js';
        import { doc, getDoc, updateDoc, increment, serverTimestamp } from 'firebase/firestore';
        import { onAuthStateChanged } from 'firebase/auth';

        let userUid = null;
        let isSpinning = false;
        
        const params = new URLSearchParams(location.search);
        const storeId = params.get('storeId');

        onAuthStateChanged(auth, async (u) => {
            if (u) {
                userUid = u.uid;
                document.getElementById('userEmail').textContent = u.email || '익명';
            } else {
                alert('로그인이 필요합니다. Jumper 앱 로그인 화면으로 이동합니다.');
                window.location.href = 'login.html?redirect=qr-event.html?storeId=' + (storeId||'');
            }
        });

        document.getElementById('btnSpin').addEventListener('click', async () => {
            if (!userUid || isSpinning || !storeId) {
                if(!storeId) document.getElementById('resultMsg').textContent = 'QR 코드가 유효하지 않습니다 (매장 ID 누락).';
                return;
            }
            isSpinning = true;
            document.getElementById('btnSpin').disabled = true;
            document.getElementById('resultMsg').textContent = '결과를 추첨 중입니다...';
            
            const display = document.getElementById('slotDisplay');
            
            let ticks = 0;
            const spinAnim = setInterval(() => {
                display.textContent = Math.floor(1000 + Math.random() * 9000);
                ticks++;
            }, 50);

            setTimeout(async () => {
                clearInterval(spinAnim);
                // Phase 2: CRM & Gamification Reward Logic
                const winAmount = Math.random() > 0.8 ? 5000 : 1000;
                display.textContent = winAmount.toString();
                display.style.color = '#fbbf24';
                document.getElementById('resultMsg').textContent = `🎉 축하합니다! ${winAmount}P 당첨!`;
                
                try {
                    await updateDoc(doc(db, 'users', userUid), {
                        generatedForMentor: increment(winAmount),
                        points: increment(winAmount)
                    });
                } catch(e) { console.error(e); }
                
                isSpinning = false;
            }, 2500);
        });
    </script>
</body>
</html>
