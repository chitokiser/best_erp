<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매장 방문 행운의 룰렛 이벤트</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>body{color:#fff;text-align:center;background:#1e293b;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:1.5rem;display:flex}.roulette-container{background:#334155;border:2px solid #4f46e5;border-radius:2rem;width:100%;max-width:350px;padding:2rem 1.5rem;position:relative;overflow:hidden;box-shadow:0 20px 25px -5px #0000001a,0 0 40px #4f46e580}.title{color:#fbbf24;text-shadow:0 2px 4px #00000080;margin-bottom:.5rem;font-size:1.8rem;font-weight:800}.subtitle{color:#94a3b8;margin-bottom:2rem;font-size:.95rem}.slot-machine{background:#0f172a;border:4px solid #475569;border-radius:1rem;margin-bottom:2rem;padding:1.5rem;position:relative}.slot-number{letter-spacing:4px;color:#10b981;font-family:monospace;font-size:4rem;font-weight:800}.btn-spin{color:#78350f;cursor:pointer;background:linear-gradient(135deg,#fbbf24 0%,#f59e0b 100%);border:none;border-radius:1rem;width:100%;padding:1.25rem;font-size:1.25rem;font-weight:800;transition:transform .1s;box-shadow:0 4px 6px #0003,inset 0 2px #fff6}.btn-spin:active{transform:scale(.95);box-shadow:inset 0 4px 6px #0006}.btn-spin:disabled{opacity:.5;pointer-events:none}#resultMsg{color:#fbbf24;min-height:1.5rem;margin-top:1rem;font-size:1.2rem;font-weight:800}</style>
  <script type="module" crossorigin src="/assets/qr-event-D1HUAgNd.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/firebase-config-CRr6M8Nr.js">
  <link rel="stylesheet" crossorigin href="/assets/css-ct6z4eHi.css">
</head>
<body>
    <div style="margin-bottom: 2rem;">
        <h2 style="color:#fff; margin:0;" id="storeName">가맹점 이벤트</h2>
        <span style="background: rgba(255,255,255,0.1); padding: 0.25rem 0.75rem; border-radius:1rem; font-size:0.8rem;">로그인 됨: <span id="userEmail">...</span></span>
    </div>

    <div class="roulette-container">
        <h1 class="title">🎰 행운의 잭팟</h1>
        <p class="subtitle">매장 방문을 100% 리워드로 돌려받으세요!</p>
        
        <div class="slot-machine">
            <div class="slot-number" id="slotDisplay">0000</div>
        </div>
        
        <button class="btn-spin" id="btnSpin">지금 스핀하기</button>
        <p id="resultMsg"></p>
    </div>

</body>
</html>
