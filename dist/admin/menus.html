<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 메뉴 관리 - AI M-SaaS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/index.css">
    <style>.menu-grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem;margin-top:1.5rem;display:grid}.menu-card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;transition:all .2s;position:relative;overflow:hidden;box-shadow:0 4px 6px -1px #0000000d}.menu-card:hover{transform:translateY(-4px);box-shadow:0 10px 15px -3px #0000001a}.menu-img{object-fit:cover;color:#94a3b8;background:#f1f5f9;justify-content:center;align-items:center;width:100%;height:160px;font-size:1.5rem;font-weight:600;display:flex}.menu-body{padding:1.25rem}.menu-title{color:#1e293b;margin:0 0 .5rem;font-size:1.1rem;font-weight:700}.menu-price{color:#4f46e5;margin:0 0 1rem;font-size:1.2rem;font-weight:800}.menu-desc{color:#64748b;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:1rem;font-size:.85rem;line-height:1.4;display:-webkit-box;overflow:hidden}.tag-row{flex-wrap:wrap;gap:.4rem;margin-bottom:1rem;display:flex}.smart-tag{border-radius:999px;padding:.2rem .6rem;font-size:.75rem;font-weight:600}.tag-hit{color:#b91c1c;background:#fee2e2}.tag-rec{color:#166534;background:#dcfce7}.tag-new{color:#3730a3;background:#e0e7ff}.tag-origin{color:#64748b;border:1px solid #e2e8f0}.toggle-switch{width:44px;height:24px;display:inline-block;position:relative}.toggle-switch input{opacity:0;width:0;height:0}.slider{cursor:pointer;background-color:#cbd5e1;border-radius:24px;transition:all .3s;position:absolute;inset:0}.slider:before{content:"";background-color:#fff;border-radius:50%;width:18px;height:18px;transition:all .3s;position:absolute;bottom:3px;left:3px}input:checked+.slider{background-color:#4f46e5}input:checked+.slider:before{transform:translate(20px)}.top-nav ul{align-items:center;gap:1rem;margin:0;padding:0;list-style:none;display:flex}.dropdown{display:inline-block;position:relative}.dropdown-content{z-index:1000;background-color:#fff;border:1px solid #e2e8f0;border-radius:.5rem;min-width:180px;display:none;position:absolute;top:100%;left:0;box-shadow:0 10px 25px #0000001a}.dropdown-content a{white-space:nowrap;border-bottom:1px solid #f1f5f9;font-size:.95rem;font-weight:500;text-decoration:none;display:block;color:#334155!important;padding:.8rem 1rem!important}.dropdown-content a:hover{background-color:#f8fafc;color:#4f46e5!important;padding-left:1.25rem!important}.dropdown:hover .dropdown-content{display:block}.dropbtn{color:#475569;cursor:pointer;border-radius:.5rem;padding:.5rem .75rem;font-weight:600;display:inline-block}</style>
  <script type="module" crossorigin src="/assets/admin_menus-NbRPAqyP.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/firebase-config-BYplozKK.js">
  <link rel="modulepreload" crossorigin href="/assets/auth-CRbH8qNP.js">
  <link rel="stylesheet" crossorigin href="/assets/admin-x1XGuNl0.css">
</head>
<body class="admin-body">
    <nav class="top-nav" style="background:#fff; padding: 1rem 2rem; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;" onclick="location.href='dashboard.html'">
            <h1 style="color:var(--ai-primary); margin:0; font-size:1.5rem; font-weight:800;"><span style="color:#ef4444;">BEST</span> M-SaaS</h1>
        </div>
        <ul>
            <li><a href="dashboard.html">CEO 대시보드</a></li>
            <li class="dropdown"><span class="dropbtn" style="color:#4F46E5; background:rgba(79,70,229,0.05);">매장 관리(F&B) ▾</span>
                <div class="dropdown-content"><a href="menus.html" style="color:#4F46E5!important;">스마트 메뉴 관리</a><a href="#">주문 현황 (준비중)</a></div>
            </li>
            <li class="dropdown"><span class="dropbtn">고객/회원관리 ▾</span>
                <div class="dropdown-content"><a href="clients.html">멘티(고객) CRM</a><a href="users.html">SaaS 회원관리</a></div>
            </li>
        </ul>
        <div id="navUserEmail" style="display:none;"></div>
    </nav>

    <div class="admin-container" style="max-width: 1400px; margin: 2rem auto; padding: 0 1.5rem;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h2 style="font-size: 1.8rem; font-weight: 800; color: #1e293b; margin:0;">🍽️ 스마트 메뉴 관리 (Phase 1)</h2>
                <p style="color: #64748b; margin-top: 0.5rem;">가맹점(Tenant)의 프론트 웹사이트와 모바일 오더 앱에 실시간으로 연동되는 메뉴 데이터베이스입니다.</p>
            </div>
            <button class="btn-primary" onclick="openMenuModal()" style="background:#4F46E5; border:none; padding:0.75rem 1.5rem; border-radius:0.5rem; color:white; font-weight:600; cursor:pointer;">+ 신규 메뉴 등록</button>
        </div>

        <!-- Filter -->
        <div style="margin-top:2rem; display:flex; gap:1rem; align-items:center;">
            <select id="filterCategory" style="padding:0.75rem; border-radius:0.5rem; border:1px solid #e2e8f0; outline:none;" onchange="loadMenus()">
                <option value="ALL">전체 카테고리</option>
                <option value="소고기">🥩 소고기</option>
                <option value="돼지고기">🥓 돼지고기</option>
                <option value="식사/전골">🍲 식사/전골</option>
                <option value="음료/주류">🍺 음료/주류</option>
            </select>
            <input type="text" id="filterSearch" placeholder="메뉴명 검색..." style="padding:0.75rem 1rem; border:1px solid #e2e8f0; border-radius:0.5rem; outline:none; flex:1; max-width:300px;" oninput="loadMenus()">
        </div>

        <div class="menu-grid" id="menuGrid">
            <!-- Menus injected here -->
        </div>
    </div>
    
    <!-- Modal -->
    <div class="modal" id="menuModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div class="modal-content" style="background:white; padding:2rem; border-radius:1rem; width:100%; max-width:500px;">
            <h2 id="modalTitle" style="margin:0 0 1.5rem 0;">신규 메뉴 등록</h2>
            
            <label style="display:block; margin-bottom:0.5rem; font-weight:600; color:#334155;">메뉴명 <span style="color:red">*</span></label>
            <input type="text" id="mName" style="width:100%; padding:0.75rem; border:1px solid #e2e8f0; border-radius:0.5rem; margin-bottom:1rem; outline:none;" placeholder="예: 무쇠 짚불 삼겹살 (2인분)">

            <label style="display:block; margin-bottom:0.5rem; font-weight:600; color:#334155;">메뉴 설명</label>
            <textarea id="mDesc" style="width:100%; padding:0.75rem; border:1px solid #e2e8f0; border-radius:0.5rem; margin-bottom:1rem; outline:none; height:80px;"></textarea>

            <div style="display:flex; gap:1rem; margin-bottom:1rem;">
                <div style="flex:1;">
                    <label style="display:block; margin-bottom:0.5rem; font-weight:600; color:#334155;">판매가 (VND/KRW) <span style="color:red">*</span></label>
                    <input type="number" id="mPrice" style="width:100%; padding:0.75rem; border:1px solid #e2e8f0; border-radius:0.5rem; outline:none;">
                </div>
                <div style="flex:1;">
                    <label style="display:block; margin-bottom:0.5rem; font-weight:600; color:#334155;">카테고리</label>
                    <select id="mCategory" style="width:100%; padding:0.75rem; border:1px solid #e2e8f0; border-radius:0.5rem; outline:none;">
                        <option value="소고기">🥩 소고기</option>
                        <option value="돼지고기">🥓 돼지고기</option>
                        <option value="식사/전골">🍲 식사/전골</option>
                        <option value="음료/주류">🍺 음료/주류</option>
                    </select>
                </div>
            </div>

            <label style="display:block; margin-bottom:0.5rem; font-weight:600; color:#334155;">스마트 마케팅 태그 (다중 선택)</label>
            <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1.5rem;" id="mTags">
                <label><input type="checkbox" value="HIT" class="tag-cb"> 🔥 HIT (인기)</label>
                <label><input type="checkbox" value="REC" class="tag-cb"> 👍 추천</label>
                <label><input type="checkbox" value="NEW" class="tag-cb"> ✨ 신메뉴</label>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:1rem;">
                <button onclick="document.getElementById('menuModal').style.display='none'" style="padding:0.75rem 1.5rem; border:none; background:#f1f5f9; border-radius:0.5rem; font-weight:600; cursor:pointer;">취소</button>
                <button id="btnSaveMenu" style="padding:0.75rem 1.5rem; border:none; background:#4F46E5; color:white; border-radius:0.5rem; font-weight:600; cursor:pointer;">메뉴 등록</button>
            </div>
        </div>
    </div>

</body>
</html>
