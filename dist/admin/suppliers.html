    <main class="container" style="padding: 2rem 1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h2>협력업체 평가 및 현황 (Suppliers & Resources)</h2>
            <button class="btn-primary" onclick="document.getElementById('supplierModal').showModal()">+ 신규 협력사
                등록</button>
        </div>

        <dialog id="supplierModal" class="card"
            style="border:none; border-radius:8px; padding:2rem; width:100%; max-width:500px;">
            <h3 style="margin-top:0; color:var(--primary-color);">신규 파트너 등록</h3>
            <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
                <div>
                    <label style="display:block; margin-bottom:0.5rem; font-size:0.9rem;">업체명 *</label>
                    <input type="text" id="supName" class="search-input" style="width:100%" placeholder="예: 삼성물산">
                </div>
                <div>
                    <label style="display:block; margin-bottom:0.5rem; font-size:0.9rem;">취급품목 (카테고리)</label>
                    <input type="text" id="supCategories" class="search-input" style="width:100%"
                        placeholder="쉼표(,)로 구분 (예: 건축자재, 철강)">
                </div>
                <div>
                    <label style="display:block; margin-bottom:0.5rem; font-size:0.9rem;">담당자명 *</label>
                    <input type="text" id="supContact" class="search-input" style="width:100%" placeholder="예: 홍길동 부장">
                </div>
                <div>
                    <label style="display:block; margin-bottom:0.5rem; font-size:0.9rem;">연락처 *</label>
                    <input type="text" id="supPhone" class="search-input" style="width:100%"
                        placeholder="예: 010-1234-5678">
                </div>
                <div style="text-align:right; margin-top:1rem;">
                    <button class="btn-primary" style="background:#64748b"
                        onclick="document.getElementById('supplierModal').close()">취소</button>
                    <button class="btn-primary" id="btnSaveSupplier" onclick="window.saveNewSupplier()">등록하기</button>
                </div>
            </div>
        </dialog>

        <div class="quick-links"
            style="margin-bottom: 2rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem;">
            <div class="card" style="border-top: 4px solid #10b981; padding: 1.5rem;">
                <h3 style="font-size: 1rem; color: var(--text-secondary); margin: 0;">우수 파트너스 (A등급)</h3>
                <p style="font-size: 2rem; font-weight: bold; color: #065f46; margin: 0.5rem 0;">4곳</p>
            </div>
            <div class="card" style="border-top: 4px solid #3b82f6; padding: 1.5rem;">
                <h3 style="font-size: 1rem; color: var(--text-secondary); margin: 0;">전체 리소스 가용 수</h3>
                <p style="font-size: 2rem; font-weight: bold; color: #1e3a8a; margin: 0.5rem 0;">18건</p>
            </div>
            <div class="card" style="border-top: 4px solid #ef4444; padding: 1.5rem;">
                <h3 style="font-size: 1rem; color: var(--text-secondary); margin: 0;">주의 / 클레임 발생</h3>
                <p style="font-size: 2rem; font-weight: bold; color: #991b1b; margin: 0.5rem 0;">1건</p>
            </div>
        </div>

        <div class="card" style="overflow-x: auto;">
            <div style="margin-bottom: 1rem; display:flex; gap:1rem; align-items:center;">
                <input type="text" placeholder="업체명, 취급품목 검색" class="search-input" style="flex:1;">
                <select class="search-input" style="width:150px;">
                    <option>등급 전체</option>
                    <option>우수 (A등급)</option>
                    <option>보통 (B등급)</option>
                    <option>주의 (C등급)</option>
                </select>
            </div>
            <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem;">
                <thead>
                    <tr style="border-bottom: 2px solid var(--border-color); color:var(--text-secondary);">
                        <th style="padding: 1rem;">업체명</th>
                        <th style="padding: 1rem;">종합 평가 (태그)</th>
                        <th style="padding: 1rem;">누적 발주액 시각화</th>
                        <th style="padding: 1rem;">취급품목</th>
                        <th style="padding: 1rem;">연락처</th>
                        <th style="padding: 1rem;">기록</th>
                    </tr>
                </thead>
                <tbody id="suppliersTableBody">
                    <tr>
                        <td colspan="5" style="padding: 1rem; text-align: center;">로딩 중...</td>
                    </tr>
                </tbody>
            </table>
