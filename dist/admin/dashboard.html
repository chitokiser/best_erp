<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드 - BEST MATERIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" crossorigin src="/assets/admin_dashboard-hnTku4uG.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/firebase-config-OD9FGzWR.js">
  <link rel="modulepreload" crossorigin href="/assets/auth-Ci8pltMn.js">
  <link rel="stylesheet" crossorigin href="/assets/firebase-config-2tIJVkuo.css">
  <link rel="stylesheet" crossorigin href="/assets/admin-x1XGuNl0.css">
</head>

<body style="display: none;">
    <!-- Login Section -->
    <div id="loginSection" class="container" style="display: none; max-width: 400px; margin-top: 5rem;">
        <div class="card">
            <h2 style="text-align:center; margin-bottom: 2rem;">관리자 로그인</h2>
            <form id="loginForm">
                <div style="margin-bottom: 1rem;">
                    <label>이메일</label>
                    <input type="email" id="txtEmail" class="search-input" style="width: 100%; margin-top:0.5rem;"
                        required>
                </div>
                <div style="margin-bottom: 2rem;">
                    <label>비밀번호</label>
                    <input type="password" id="txtPassword" class="search-input" style="width: 100%; margin-top:0.5rem;"
                        required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-bottom: 0.5rem;">이메일 로그인</button>
                <div
                    style="display: flex; align-items: center; justify-content: center; margin: 1rem 0; color: #94a3b8;">
                    <hr style="flex:1; border:none; border-top:1px solid #e2e8f0;">
                    <span style="padding: 0 0.5rem; font-size: 0.875rem;">또는</span>
                    <hr style="flex:1; border:none; border-top:1px solid #e2e8f0;">
                </div>
                <button type="button" id="btnGoogleLogin" class="btn-primary"
                    style="width: 100%; background-color: white; color: #333; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="#4285F4" />
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853" />
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                            fill="#FBBC05" />
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335" />
                    </svg>
                    Google 계정으로 연동/로그인
                </button>
            </form>
            <p id="loginError" style="color: red; text-align:center; margin-top: 1rem;"></p>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" style="display: none;">
        <header class="main-header">
            <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
                <h1 class="logo">BESTwinner</h1>
                <nav class="main-nav">
                    <ul>
                        <li><a href="dashboard.html" style="color:var(--primary-color)">대시보드</a></li>
                        <li><a href="projects.html">프로젝트</a></li>
                        <li><a href="materials.html">자재관리</a></li>
                        <li><a href="suppliers.html">협력업체</a></li>
                        <li><a href="users.html">권한관리</a></li>
                        <li><button id="btnLogout" class="btn-primary" style="padding: 0.5rem 1rem;">로그아웃</button></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main class="container" style="padding: 2rem 1rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2>BESTwinner 총괄 대시보드</h2>
                <span style="font-size: 0.875rem; color: var(--text-secondary);">마지막 현황: 2026-09-25</span>
            </div>

            <!-- 핵심 지표 요약 -->
            <div class="quick-links"
                style="margin-bottom: 2rem; display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem;">
                <div class="card" style="border-top: 4px solid var(--primary-color); padding: 1.5rem;">
                    <h3 style="font-size: 1rem; color: var(--text-secondary); margin: 0;">진행중인 프로젝트</h3>
                    <p style="font-size: 2.5rem; font-weight: bold; color: var(--text-primary); margin: 0.5rem 0;"
                        id="statProjects">0</p>
                    <p style="font-size: 0.875rem; color: #10b981; margin: 0; font-weight: 500;"
                        id="statProjectsCaption">계산 중...</p>
                </div>
                <div class="card" style="border-top: 4px solid #f59e0b; padding: 1.5rem;">
                    <h3 style="font-size: 1rem; color: var(--text-secondary); margin: 0;">진행 예산 소진율</h3>
                    <p style="font-size: 2.5rem; font-weight: bold; color: var(--text-primary); margin: 0.5rem 0;"
                        id="statBudget">0%</p>
                    <p style="font-size: 0.875rem; color: var(--text-secondary); margin: 0; font-weight: 500;">안정적 상태
                    </p>
                </div>
                <div class="card" style="border-top: 4px solid #3b82f6; padding: 1.5rem;">
                    <h3 style="font-size: 1rem; color: var(--text-secondary); margin: 0;">누적 자재 데이터</h3>
                    <p style="font-size: 2.5rem; font-weight: bold; color: var(--text-primary); margin: 0.5rem 0;"
                        id="txtTotalMaterials">0</p>
                    <p style="font-size: 0.875rem; color: var(--text-secondary); margin: 0; font-weight: 500;">BEST 자재
                        DB</p>
                </div>
                <div class="card" style="border-top: 4px solid #ef4444; padding: 1.5rem;">
                    <h3 style="font-size: 1rem; color: var(--text-secondary); margin: 0;">결재 대기</h3>
                    <p style="font-size: 2.5rem; font-weight: bold; color: var(--text-primary); margin: 0.5rem 0;"
                        id="statPendingReqs">0</p>
                    <p style="font-size: 0.875rem; color: #ef4444; margin: 0; font-weight: 500;">요청 확인 필요</p>
                </div>
            </div>

            <!-- 프로젝트 현황 & 차트 -->
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;" class="quick-links">
                <!-- 주요 프로젝트 테이블 -->
                <div class="card"
                    style="padding: 1.5rem; background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h3 style="font-size: 1.25rem;">최근 기안 사항 (결재 대기)</h3>
                        <a href="projects.html"
                            style="font-size: 0.875rem; color: var(--primary-color); text-decoration: none; font-weight: bold;">전체보기
                            &rarr;</a>
                    </div>
                    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem;">
                        <thead>
                            <tr style="border-bottom: 2px solid #e2e8f0;">
                                <th style="padding: 1rem 0.5rem; font-weight: 600; color: var(--text-secondary);">요청부서
                                </th>
                                <th style="padding: 1rem 0.5rem; font-weight: 600; color: var(--text-secondary);">기안자
                                </th>
                                <th style="padding: 1rem 0.5rem; font-weight: 600; color: var(--text-secondary);">금액
                                </th>
                                <th style="padding: 1rem 0.5rem; font-weight: 600; color: var(--text-secondary);">상태
                                </th>
                            </tr>
                        </thead>
                        <tbody id="dashboardPurchaseReqBody">
                            <tr>
                                <td colspan="4" style="text-align:center; padding:1rem; color:var(--text-secondary);">
                                    데이터를 불러오는 중...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>

            <!-- 예산 시각화 차트 -->
            <div class="chart-container"
                style="background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display:flex; flex-direction:column;">
                <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">금월 프로젝트 총 예산 집행액</h3>
                <div style="flex:1; position:relative;">
                    <canvas id="budgetChart"></canvas>
                </div>
            </div>
    </div>
    </main>
    </div>


    <!-- Global Auth Guard -->
</body>

</html>
