e-expense{color:#991b1b;background:#fee2e2}.badge-receivable{color:#1e40af;background:#dbeafe}.badge-payable{color:#92400e;background:#fef3c7}.modal-overlay{z-index:100;background:#00000080;justify-content:center;align-items:center;width:100%;height:100%;display:none;position:fixed;top:0;left:0}.modal-content{background:#fff;border-radius:1rem;width:600px;max-width:95%;padding:2.5rem}.modal-header{justify-content:space-between;align-items:center;margin-bottom:1.5rem;display:flex}.modal-header h3{margin:0;font-size:1.4rem;font-weight:800}.close-btn{cursor:pointer;color:var(--text-muted);background:0 0;border:none;font-size:1.5rem}.form-group{margin-bottom:1.25rem}.form-group label{color:var(--text-dark);margin-bottom:.5rem;font-size:.9rem;font-weight:600;display:block}.form-group input,.form-group select,.form-group textarea{box-sizing:border-box;border:1px solid #cbd5e1;border-radius:.5rem;width:100%;padding:.8rem;font-family:inherit;font-size:1rem}.form-row{gap:1rem;display:flex}.form-row .form-group{flex:1;margin-bottom:1rem}.submit-btn{background:var(--text-dark);color:#fff;cursor:pointer;border:none;border-radius:.5rem;width:100%;margin-top:1rem;padding:1rem;font-size:1.1rem;font-weight:700;transition:all .2s}.submit-btn:hover{background:var(--ai-primary)}.top-nav{z-index:50;background:#fff;justify-content:space-between;align-items:center;padding:1rem 2rem;display:flex;position:sticky;top:0;box-shadow:0 4px 6px -1px #0000000d}.top-nav h1{color:var(--ai-primary,#4f46e5);margin:0;font-size:1.5rem;font-weight:800}.top-nav ul{gap:2rem;margin:0;padding:0;list-style:none;display:flex}.top-nav a{color:var(--text-muted,#64748b);font-size:.95rem;font-weight:600;text-decoration:none;transition:color .2s}.top-nav a:hover,.top-nav a.active{color:var(--ai-primary,#4f46e5)}</style>

    <div class="main-container">
        <div class="header-action">
            <h2>AI 재무/현금흐름 DB</h2>
            <button class="btn-add" id="openModalBtn">+ 새 재무 데이터 등록</button>
        </div>

        <div class="finance-summary">
            <div class="summary-box">
                <div class="summary-label">이번 달 수입</div>
                <div class="summary-val val-income" id="sumIncome">0 VND</div>
            </div>
            <div class="summary-box">
                <div class="summary-label">이번 달 지출</div>
                <div class="summary-val val-expense" id="sumExpense">0 VND</div>
            </div>
            <div class="summary-box">
                <div class="summary-label">받을 돈 (미수금)</div>
                <div class="summary-val val-receivable" id="sumReceivable">0 VND</div>
            </div>
            <div class="summary-box">
                <div class="summary-label">줄 돈 (미지급금)</div>
                <div class="summary-val val-payable" id="sumPayable">0 VND</div>
            </div>
        </div>

        <div class="data-card">
            <table>
                <thead>
                    <tr>
                        <th>발생일자</th>
                        <th>유형/항목</th>
                        <th>금액</th>
                        <th>관련 거래처/프로젝트</th>
                        <th>적요(내용)</th>
                    </tr>
                </thead>
                <tbody id="financeTableBody">
                    <tr>
                        <td colspan="5" style="text-align:center; padding:3rem; color:var(--text-muted);">등록된 재무 데이터가
                            없습니다.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Finance Modal -->
    <div class="modal-overlay" id="financeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>재무 기록 추가</h3>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <form id="financeForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>돈의 성격 (유형)</label>
                        <select id="finType" required>
                            <option value="INCOME">📈 수입 (입금 완료)</option>
                            <option value="EXPENSE">📉 지출 (출금 완료)</option>
                            <option value="RECEIVABLE">📥 받을 돈 (수입 예정/미수금)</option>
                            <option value="PAYABLE">📤 줄 돈 (지출 예정/미지급금)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>발생/예정 일자</label>
                        <input type="date" id="finDate" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>항목 분류</label>
                        <input type="text" id="finCategory" placeholder="예: 인건비, 임대료, 외상대금, 자재비" required
                            list="catList">
                        <datalist id="catList">
                            <option value="자재비/원가"></option>
                            <option value="인건비/급여"></option>
                            <option value="임대료/공과금"></option>
                            <option value="외주/용역비"></option>
                            <option value="장비대여료"></option>
                            <option value="영업/운영경비"></option>
                            <option value="외상대금상환"></option>
                        </datalist>
                    </div>
                    <div class="form-group">
                        <label>금액 (VND)</label>
                        <input type="number" id="finAmount" required placeholder="예: 5000000">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>관련 거래처 (고객/협력사)</label>
                            <input type="text" id="finPartner" placeholder="예: 삼성물산">
                        </div>
                        <div class="form-group">
                            <label>관련 프로젝트</label>
                            <input type="text" id="finProject" placeholder="예: A구역 인테리어">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>적요 (상세 내용)</label>
                        <textarea id="finMemo" rows="2" placeholder="예: 1차 중도금 수령, 자재 대금 지급 등"></textarea>
                    </div>

                    <button type="submit" class="submit-btn" id="btnSubmit">저장하기</button>
            </form>
        </div>
    </div>
