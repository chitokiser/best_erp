rem;width:100%;padding:.75rem;font-family:inherit;font-size:.95rem}.form-row{gap:1rem;display:flex}.form-row .form-group{flex:1}.submit-btn{background:var(--text-dark);color:#fff;cursor:pointer;border:none;border-radius:.5rem;width:100%;margin-top:1rem;padding:.75rem;font-weight:600}.top-nav{z-index:50;background:#fff;justify-content:space-between;align-items:center;padding:1rem 2rem;display:flex;position:sticky;top:0;box-shadow:0 4px 6px -1px #0000000d}.top-nav h1{color:var(--ai-primary,#4f46e5);margin:0;font-size:1.5rem;font-weight:800}.top-nav ul{gap:2rem;margin:0;padding:0;list-style:none;display:flex}.top-nav a{color:var(--text-muted,#64748b);font-size:.95rem;font-weight:600;text-decoration:none;transition:color .2s}.top-nav a:hover,.top-nav a.active{color:var(--ai-primary,#4f46e5)}</style>

    <div class="main-container">
        <div class="header-action">
            <h2>AI 분석용 직원 데이터</h2>
            <button class="btn-add" id="openModalBtn">+ 새 직원 등록</button>
        </div>

        <div class="data-card">
            <table>
                <thead>
                    <tr>
                        <th>이름/직급</th>
                        <th>부서</th>
                        <th>연락처</th>
                        <th>보유 기술(역량)</th>
                        <th>급여/평가</th>
                        <th>현재 업무량</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="empTableBody">
                    <tr>
                        <td colspan="5" style="text-align:center; padding:2rem; color:var(--text-muted);">로딩 중...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Employee Modal -->
    <div class="modal-overlay" id="empModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalEmpTitle">직원 프로필 등록</h3><input type="hidden" id="empId" value="">
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <form id="empForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>이름</label>
                        <input type="text" id="empName" required placeholder="예: 김철수">
                    </div>
                    <div class="form-group">
                        <label>직급</label>
                        <input type="text" id="empPosition" required placeholder="예: 과장">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>부서</label>
                        <input type="text" id="empDept" required placeholder="예: 기술팀">
                    </div>
                    <div class="form-group">
                        <label>현재 업무량 (%)</label>
                        <input type="number" id="empWorkload" min="0" max="150" required placeholder="예: 85 (0~100)">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>월 급여 (VND)</label>
                        <input type="number" id="empSalary" placeholder="예: 25000000 (숫자만)"
                            style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; box-sizing: border-box;">
                    </div>
                    <div class="form-group">
                        <label>최근 인사평가</label>
                        <select id="empPerformance">
                            <option value="">평가 전</option>
                            <option value="S (최우수)">S (최우수)</option>
                            <option value="A (우수)">A (우수)</option>
                            <option value="B (보통)">B (보통)</option>
                            <option value="C (미흡)">C (미흡)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>이메일 / 연락처</label>
                    <input type="email" id="empContact" required placeholder="예: chulsoo@best.com">
                </div>
                <div class="form-group">
                    <label>보유 기술 및 전문분야 (쉼표로 구분)</label>
                    <input type="text" id="empSkills" placeholder="예: CAD, 현장소장, 자재관리">
                </div>
                <button type="submit" class="submit-btn" id="btnSubmit">저장하기</button>
            </form>
        </div>
    </div>
