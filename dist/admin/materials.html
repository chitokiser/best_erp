                <label style="display:block; margin-bottom:0.5rem; font-size:0.9rem;">반출 수량 (현재: <span

            <div style="margin-bottom:1rem">

            <div style="text-align:right; margin-top:2rem;">
                <button class="btn-primary" style="background:#64748b"
                    onclick="document.getElementById('consumeModal').close()">취소</button>
                <button class="btn-primary" style="background:#ef4444" id="btnConfirmConsume"
                    onclick="window.submitConsume()">소모 확정</button>

                <input type="text" id="adminSearchFilter" class="search-input" placeholder="🔍 자재명 또는 코드 검색..."
                    style="padding: 0.5rem; width: 220px;">
                <select id="adminCatFilter" class="search-input" style="padding: 0.5rem;">
                    <option value="">모든 카테고리 ▼</option>
                    <option value="인테리어">인테리어</option>
                    <option value="엘리베이터">엘리베이터</option>
                    <option value="소방">소방</option>

                <button class="btn-primary" style="background:#f59e0b;" onclick="window.editSelected()">✏️ 선택
                    수정</button>
                <button class="btn-primary" style="background:#ef4444;" onclick="window.deleteSelected()">🗑️ 선택
                    삭제</button>
                <button class="btn-primary" style="background:var(--success, #10B981);"
                    onclick="window.requestSelectedPurchase()">🛒 선택 구매요청</button>
                <button class="btn-primary" onclick="window.goToRegisterMaterial()">+ 자재 등록</button>
            </div>
        </div>

        <div class="card" style="overflow-x: auto;">

                        <th style="padding: 1rem; width: 40px;"><input type="checkbox" id="selectAllMaterials"
                                onclick="window.toggleAllMaterials(this.checked)"></th>
                        <th style="padding: 1rem; width: 60px;">사진</th>
                        <th style="padding: 1rem;">자재코드</th>
