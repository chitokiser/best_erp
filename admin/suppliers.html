<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>협력업체 평가 및 현황 - BESTwinner</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body style="display: none;">
    <header class="main-header">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <h1 class="logo">BESTwinner</h1>
            <nav class="main-nav">
                <ul>
                    <li><a href="dashboard.html">대시보드</a></li>
                    <li><a href="projects.html">프로젝트</a></li>
                    <li><a href="materials.html">자재관리</a></li>
                    <li><a href="suppliers.html" style="color:var(--primary-color)">협력업체</a></li>
                    <li><a href="users.html">권한관리</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container" style="padding: 2rem 1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h2>협력업체 평가 및 현황 (Suppliers & Resources)</h2>
            <button class="btn-primary" onclick="alert('신규 파트너를 등록하고 초기 평가 그룹을 지정합니다.')">+ 신규 협력사 등록</button>
        </div>

        <div class="quick-links"
            style="margin-bottom: 2rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem;">
            <div class="card" style="border-top: 4px solid #10b981; padding: 1.5rem;">
                <h3 style="font-size: 1rem; color: var(--text-secondary); margin: 0;">우수 파트너스 (A등급)</h3>
                <p style="font-size: 2rem; font-weight: bold; color: #065f46; margin: 0.5rem 0;">4곳</p>
            </div>
            <div class="card" style="border-top: 4px solid #3b82f6; padding: 1.5rem;">
                <h3 style="font-size: 1rem; color: var(--text-secondary); margin: 0;">전체 리소스 가용 수</h3>
                <p style="font-size: 2rem; font-weight: bold; color: #1e3a8a; margin: 0.5rem 0;">18건</p>
            </div>
            <div class="card" style="border-top: 4px solid #ef4444; padding: 1.5rem;">
                <h3 style="font-size: 1rem; color: var(--text-secondary); margin: 0;">주의 / 클레임 발생</h3>
                <p style="font-size: 2rem; font-weight: bold; color: #991b1b; margin: 0.5rem 0;">1건</p>
            </div>
        </div>

        <div class="card" style="overflow-x: auto;">
            <div style="margin-bottom: 1rem; display:flex; gap:1rem; align-items:center;">
                <input type="text" placeholder="업체명, 취급품목 검색" class="search-input" style="flex:1;">
                <select class="search-input" style="width:150px;">
                    <option>등급 전체</option>
                    <option>우수 (A등급)</option>
                    <option>보통 (B등급)</option>
                    <option>주의 (C등급)</option>
                </select>
            </div>
            <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem;">
                <thead>
                    <tr style="border-bottom: 2px solid var(--border-color); color:var(--text-secondary);">
                        <th style="padding: 1rem;">업체명</th>
                        <th style="padding: 1rem;">종합 평가 (태그)</th>
                        <th style="padding: 1rem;">누적 발주액 시각화</th>
                        <th style="padding: 1rem;">취급품목</th>
                        <th style="padding: 1rem;">연락처</th>
                        <th style="padding: 1rem;">기록</th>
                    </tr>
                </thead>
                <tbody id="suppliersTableBody">
                    <tr>
                        <td colspan="5" style="padding: 1rem; text-align: center;">로딩 중...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module" src="../assets/js/firebase-config.js"></script>
    <script type="module">
        import { getAllSuppliers } from '../services/supplierApi.js';

        const loadSuppliers = async () => {
            const tbody = document.getElementById('suppliersTableBody');
            try {
                const suppliers = await getAllSuppliers();
                if (suppliers.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="padding: 1rem; text-align: center;">등록된 공급업체가 없습니다.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                suppliers.forEach((s, idx) => {
                    // Mock evaluation logic for presentation
                    const randomAmount = Math.floor(Math.random() * 80) + 10;
                    let e = { label: '보통', color: '#1f2937', bg: '#f3f4f6' };
                    if (idx % 3 === 0) e = { label: '우수', color: '#065f46', bg: '#d1fae5' };
                    if (idx === 4) e = { label: '주의 (클레임)', color: '#991b1b', bg: '#fee2e2' };

                    const tr = document.createElement('tr');
                    tr.style.borderBottom = '1px solid var(--border-color)';

                    tr.innerHTML = `
                        <td style="padding: 1rem; font-weight: 500;">${s.companyName || '-'}</td>
                        <td style="padding: 1rem;">
                            <span style="background:${e.bg}; color:${e.color}; padding:0.25rem 0.5rem; border-radius:4px; font-size:0.8rem; font-weight:bold;">${e.label}</span>
                        </td>
                        <td style="padding: 1rem;">
                            <div style="display: flex; align-items: center; gap: 0.5rem;">
                                <div style="width: 100px; background: #e2e8f0; height: 6px; border-radius: 3px; overflow: hidden;">
                                    <div style="background: var(--primary-color); width: ${(randomAmount / 100) * 100}%; height: 100%;"></div>
                                </div>
                                <span style="font-size: 0.85rem; font-weight: 600;">₩ ${randomAmount}M</span>
                            </div>
                        </td>
                        <td style="padding: 1rem;">${(s.categories || []).join(', ') || '-'}</td>
                        <td style="padding: 1rem; font-size:0.875rem;">${s.contactPerson || '-'} (${s.phone || '-'})</td>
                        <td style="padding: 1rem;"><button class="btn-primary" style="padding:0.25rem 0.5rem; background:#64748b; font-size:0.8rem;" onclick="alert('평가 히스토리 보기 팝업 띄우기')">평가/리뷰 조회</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="5" style="padding: 1rem; text-align: center; color: red;">오류 발생: ${err.message}</td></tr>`;
            }
        };

        loadSuppliers();
    </script>

    <!-- Global Auth Guard -->
    <script type="module">
        import { checkAdminAuth } from '../assets/js/auth.js';

        checkAdminAuth(
            (user) => {
                document.body.style.display = 'block';

                // Add logout button / User email to header dynamically if header exists
                const nav = document.querySelector('.main-nav ul');
                if (nav && !document.getElementById('navUserEmail')) {
                    const li = document.createElement('li');
                    li.id = 'navUserEmail';
                    li.innerHTML = `<span style="margin-left: 1rem; font-size:0.875rem; color:var(--text-secondary);">${user.email}</span>
                                    <button onclick="window.logoutAndRedirect()" style="margin-left:0.5rem; background:none; border:none; cursor:pointer; color:var(--primary-color); font-weight:bold;">[로그아웃]</button>`;
                    nav.appendChild(li);
                }
            },
            () => {
                const current = window.location.pathname + window.location.search;
                window.location.href = '../login.html?redirect=' + encodeURIComponent(current);
            }
        );

        import { logoutAdmin } from '../assets/js/auth.js';
        window.logoutAndRedirect = () => {
            logoutAdmin();
            window.location.href = '../login.html';
        };
    </script>
</body>

</html>
