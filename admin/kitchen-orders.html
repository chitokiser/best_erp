<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍽️ 실시간 주방/카운터 주문 알림판 (KDS) | BestERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
  <style>
    .kds-wrap { max-width: 1180px; margin: 20px auto; padding: 0 16px 48px; }
    .kds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
    .kds-card { background: #fff; border: 2px solid #e2e8f0; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 6px 18px rgba(15,23,42,.05); }
    .kds-card.st-pending { border-color: #ef4444; background: #fffbfb; }
    .kds-card.st-preparing { border-color: #f59e0b; background: #fffdf5; }
    .kds-card.st-completed { border-color: #10b981; opacity: .78; }
    .kds-head { display: flex; justify-content: space-between; align-items: center; }
    .kds-table { font-size: 1.15rem; font-weight: 900; color: #0f172a; }
    .kds-pill { padding: 3px 9px; border-radius: 999px; font-size: 0.74rem; font-weight: 800; }
    .kds-items { list-style: none; padding: 8px 0; border-top: 1px dashed #e2e8f0; border-bottom: 1px dashed #e2e8f0; font-size: 0.88rem; display: flex; flex-direction: column; gap: 5px; }
    .kds-btns { display: flex; gap: 8px; }
    .kds-btn { flex: 1; padding: 9px; border-radius: 10px; border: none; font-weight: 800; font-size: 0.82rem; cursor: pointer; }
    .sub-nav { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:10px 14px; margin-bottom:14px; }
    .sub-nav-links { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
    .nav-pill { padding:6px 11px; border-radius:9px; font-size:.8rem; font-weight:800; border:1px solid #e2e8f0; background:#f8fafc; color:#334155; text-decoration:none; cursor:pointer; }
    .nav-pill.active { background:#ea580c; color:#fff; border-color:#ea580c; }
  </style>
</head>
<body class="admin-body">
  <div class="kds-wrap">
    <div class="sub-nav">
      <div class="sub-nav-links">
        <a href="dashboard.html" class="nav-pill">← 대시보드</a>
        <a href="kitchen-orders.html" class="nav-pill active">🍽️ 실시간 KDS</a>
        <a href="table-qr-print.html" class="nav-pill">🖨️ 테이블 QR</a>
        <a href="recipe-bom.html" class="nav-pill">🧾 레시피 BOM</a>
        <a href="approvals.html" class="nav-pill">📝 전자결재</a>
        <a href="scm-voc.html" class="nav-pill">🚚 SCM·VOC</a>
      </div>
      <div class="sub-nav-links">
        <a href="https://bestclubvn.netlify.app/merchant-qr" target="_blank" rel="noopener" class="nav-pill" style="background:#fffbeb;color:#b45309;border-color:#fde68a;">🎟️ BestClub BT 지급</a>
        <button type="button" id="btnKdsLogout" class="nav-pill" style="color:#dc2626;border-color:#fecaca;background:#fef2f2;">로그아웃</button>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
      <div>
        <h2 style="margin:0;font-size:1.4rem;font-weight:900;">🍽️ 실시간 주방 / 카운터 주문 알림판 (KDS)</h2>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <span id="kdsStoreBadge" style="padding:6px 12px;border-radius:999px;background:#dcfce7;color:#15803d;font-weight:800;font-size:0.82rem;">🟢 실시간 대기 중</span>
        <a href="table-qr-print.html" style="padding:7px 12px;border-radius:10px;background:#4f46e5;color:#fff;font-weight:800;font-size:0.82rem;text-decoration:none;">🖨️ 테이블 QR 생성</a>
        <a href="recipe-bom.html" style="padding:7px 12px;border-radius:10px;background:#059669;color:#fff;font-weight:800;font-size:0.82rem;text-decoration:none;">🧾 레시피 원가(BOM)</a>
        <button type="button" id="btnSoundToggle" style="padding:7px 12px;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font-weight:800;font-size:0.82rem;cursor:pointer;">🔊 주문 알림음 ON</button>
      </div>
    </div>

    <div id="kdsToast" style="display:none;margin-bottom:12px;padding:10px 14px;border-radius:12px;background:#ecfdf5;border:1px solid #6ee7b7;color:#065f46;font-size:0.84rem;font-weight:800;"></div>

    <div id="kdsGrid" class="kds-grid">
      <div style="grid-column:1/-1;text-align:center;padding:48px;color:#64748b;background:#fff;border-radius:16px;border:1px dashed #cbd5e1;">
        실시간 주문을 연결하는 중입니다...
      </div>
    </div>
  </div>

  <script type="module">
    import { checkAdminAuth, logoutAdmin } from '../assets/js/auth.js';
    import { getCurrentStoreInfo, loadDynamicTenants } from '../assets/js/tenant-router.js';
    import { db } from '../assets/js/firebase-config.js';
    import { collection, query, where, onSnapshot, doc, getDoc, updateDoc, increment, serverTimestamp, limit } from 'firebase/firestore';

    document.getElementById('btnKdsLogout')?.addEventListener('click', () => logoutAdmin());

    let soundOn = true;
    let initialLoaded = false;
    let _activeStoreId = '';
    let _ordersCache = {};

    function showToast(msg) {
      const el = document.getElementById('kdsToast');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 4200);
    }

    function playDingDong() {
      if (!soundOn) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ctx = new AC();
        const now = ctx.currentTime;
        [880, 1174.66].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.16);
          gain.gain.setValueAtTime(0.001, now + i * 0.16);
          gain.gain.exponentialRampToValueAtTime(0.22, now + i * 0.16 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.16 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.16);
          osc.stop(now + i * 0.16 + 0.36);
        });
      } catch (_) {}
    }

    document.getElementById('btnSoundToggle').addEventListener('click', () => {
      soundOn = !soundOn;
      document.getElementById('btnSoundToggle').textContent = soundOn ? '🔊 주문 알림음 ON' : '🔇 주문 알림음 OFF';
      if (soundOn) playDingDong();
    });

    function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    // KDS 완료 시 메뉴별 레시피(BOM) 원재료 자동 차감
    async function deductBomForOrder(order) {
      if (!order || order.bom_deducted || !_activeStoreId) return 0;
      const items = Array.isArray(order.items) ? order.items : [];
      const deductions = {};
      for (const it of items) {
        const pid = it.product_id || it.id;
        const orderQty = Number(it.qty || it.quantity || 1);
        if (!pid || orderQty <= 0) continue;
        try {
          const pSnap = await getDoc(doc(db, 'merchant_products', String(pid)));
          if (!pSnap.exists()) continue;
          const bom = pSnap.data()?.bom;
          if (!Array.isArray(bom)) continue;
          bom.forEach((b) => {
            if (!b.ingredientId || !(Number(b.qty) > 0)) return;
            deductions[b.ingredientId] = (deductions[b.ingredientId] || 0) + Number(b.qty) * orderQty;
          });
        } catch (_) {}
      }
      const entries = Object.entries(deductions);
      for (const [ingId, totalQty] of entries) {
        try {
          await updateDoc(doc(db, 'merchants', _activeStoreId, 'ingredients', ingId), {
            stock: increment(-totalQty),
            updatedAt: serverTimestamp(),
          });
        } catch (_) {}
      }
      if (entries.length) {
        await updateDoc(doc(db, 'merchant_orders', order.id), { bom_deducted: true });
      }
      return entries.length;
    }

    function renderOrders(orders) {
      const grid = document.getElementById('kdsGrid');
      _ordersCache = {};
      orders.forEach((o) => { _ordersCache[o.id] = o; });

      if (!orders.length) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:48px;color:#64748b;background:#fff;border-radius:16px;border:1px dashed #cbd5e1;">현재 들어온 실시간 주문이 없습니다. 새 주문이 접수되면 딩동! 알림음과 함께 즉시 표시됩니다.</div>';
        return;
      }

      grid.innerHTML = orders.map((o) => {
        const st = String(o.status || 'pending').toLowerCase();
        const cls = st === 'completed' || st === 'paid' ? 'st-completed' : (st === 'preparing' ? 'st-preparing' : 'st-pending');
        const pillBg = cls === 'st-pending' ? '#fee2e2' : (cls === 'st-preparing' ? '#fef3c7' : '#dcfce7');
        const pillCol = cls === 'st-pending' ? '#b91c1c' : (cls === 'st-preparing' ? '#b45309' : '#15803d');
        const pillTxt = cls === 'st-pending' ? '🔴 신규 접수' : (cls === 'st-preparing' ? '🟠 조리 중' : '🟢 완료');
        const tableLabel = o.tableNumber ? `테이블 ${o.tableNumber}` : (o.buyer_name || '온라인/QR 주문');
        const itemsHtml = (Array.isArray(o.items) ? o.items : []).map((it) =>
          `<li>• <strong>${esc(it.product_name || it.name || '메뉴')}</strong> × ${Number(it.qty || it.quantity || 1)}</li>`
        ).join('') || '<li>상세 메뉴 없음</li>';
        const noteHtml = o.note ? `<div style="font-size:0.8rem;background:#fefce8;border:1px solid #fde68a;color:#854d0e;padding:6px 9px;border-radius:8px;">📝 ${esc(o.note)}</div>` : '';
        const payHtml = o.payment_verified
          ? '<div style="font-size:0.78rem;background:#dcfce7;color:#15803d;padding:5px 9px;border-radius:8px;font-weight:800;">💚 VietQR 입금 확인 완료</div>'
          : (o.payment_claimed
              ? `<div style="font-size:0.78rem;background:#dbeafe;color:#1d4ed8;padding:6px 9px;border-radius:8px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:6px;"><span>💸 고객 VietQR 송금 완료 요청</span><button type="button" class="kds-pay-btn" data-pay="${esc(o.id)}" style="padding:4px 8px;border:none;border-radius:7px;background:#2563eb;color:#fff;font-weight:800;font-size:0.74rem;cursor:pointer;">입금 확인</button></div>`
              : '');
        const total = Number(o.total_amount || o.totalAmount || 0);

        return `
          <article class="kds-card ${cls}">
            <div class="kds-head">
              <div class="kds-table">🍽️ ${esc(tableLabel)}</div>
              <span class="kds-pill" style="background:${pillBg};color:${pillCol};">${pillTxt}</span>
            </div>
            <ul class="kds-items">${itemsHtml}</ul>
            ${noteHtml}
            ${payHtml}
            <div style="display:flex;justify-content:space-between;font-size:0.86rem;font-weight:800;">
              <span>합계 금액</span>
              <span style="color:#4f46e5;">${total.toLocaleString()} VND</span>
            </div>
            <div class="kds-btns">
              ${cls === 'st-pending' ? `<button type="button" class="kds-btn" data-id="${esc(o.id)}" data-next="preparing" style="background:#f59e0b;color:#fff;">👨‍🍳 조리 시작</button>` : ''}
              ${cls !== 'st-completed' ? `<button type="button" class="kds-btn" data-id="${esc(o.id)}" data-next="completed" style="background:#10b981;color:#fff;">✅ 서빙/완료</button>` : ''}
            </div>
          </article>`;
      }).join('');

      grid.querySelectorAll('.kds-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const next = btn.dataset.next;
          await updateDoc(doc(db, 'merchant_orders', id), { status: next, updated_at: serverTimestamp() });
          if (next === 'completed') {
            const count = await deductBomForOrder(_ordersCache[id]);
            if (count > 0) showToast(`📦 레시피(BOM) 연동 원재료 ${count}건 재고가 자동 차감되었습니다!`);
          }
        });
      });

      grid.querySelectorAll('.kds-pay-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.pay;
          await updateDoc(doc(db, 'merchant_orders', id), { payment_verified: true, updated_at: serverTimestamp() });
          showToast('💚 VietQR 입금 확인이 손님 화면에 실시간 반영되었습니다!');
        });
      });
    }

    checkAdminAuth(async () => {
      await loadDynamicTenants();
      const info = getCurrentStoreInfo();
      if (!info.storeId) { location.href = '../onboarding.html'; return; }
      const sid = String(info.storeId);
      _activeStoreId = sid;
      const sNum = Number(sid);
      const candidates = Number.isFinite(sNum) ? [sid, sNum] : [sid];
      document.getElementById('kdsStoreBadge').textContent = `🟢 ${info.name} 실시간 주문 감시 중`;

      const q = query(collection(db, 'merchant_orders'), where('merchant_id', 'in', candidates), limit(40));
      onSnapshot(q, (snap) => {
        if (initialLoaded) {
          const hasNew = snap.docChanges().some((ch) => ch.type === 'added');
          if (hasNew) playDingDong();
        }
        initialLoaded = true;
        const orders = snap.docs
          .map((d) => ({ id: d.id, ...d.data() }))
          .sort((a, b) => ((b.created_at?.seconds || b.createdAt?.seconds || 0) - (a.created_at?.seconds || a.createdAt?.seconds || 0)));
        renderOrders(orders);
      });
    });
  </script>
</body>
</html>
