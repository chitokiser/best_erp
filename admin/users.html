<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>권한 및 담당자 관리 - BEST Group</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .role-badge {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .role-super {
            background: #fee2e2;
            color: #991b1b;
        }

        .role-admin {
            background: #dbfafe;
            color: #075985;
        }

        .role-staff {
            background: #fef3c7;
            color: #92400e;
        }

        .role-viewer {
            background: #f1f5f9;
            color: #475569;
        }
    
        .dropdown { position: relative; display: inline-block; margin-top:2px; }
        .dropdown-content { display: none; position: absolute; background-color: white; min-width: 180px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-radius: 0.5rem; border: 1px solid #e2e8f0; z-index: 1000; overflow: hidden; top:100%; left:0; }
        .dropdown-content a { color: #334155 !important; padding: 0.8rem 1rem !important; text-decoration: none; display: block; font-size: 0.95rem; font-weight: 500; border-bottom: 1px solid #f1f5f9; transition: all 0.2s; white-space: nowrap; }
        .dropdown-content a:last-child { border-bottom: none; }
        .dropdown-content a:hover { background-color: #f8fafc; color: #4F46E5 !important; padding-left: 1.25rem !important; }
        .dropdown:hover .dropdown-content { display: block; animation: fadeInUp 0.2s ease-out; }
        .dropbtn { padding: 0.5rem 0.75rem; color: #475569; font-weight: 600; cursor: pointer; border-radius: 0.5rem; transition: background 0.2s; display:inline-block; }
        .dropdown:hover .dropbtn { color: #4F46E5; background: rgba(79, 70, 229, 0.05); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>

    <!-- FORCE CSS -->
    <style>
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: nowrap;
            overflow: visible;
            position: relative;
        }

        .logo-container {
            width: auto !important;
        }

        .top-nav ul {
            display: flex;
            align-items: center;
            gap: 1rem;
            list-style: none;
            margin: 0;
            padding: 0;
            flex-wrap: nowrap !important;
        }

        .top-nav ul li a {
            white-space: nowrap !important;
        }

        .mobile-only-btn {
            display: none !important;
        }

        @media screen and (max-width: 900px) {
            .mobile-only-btn {
                display: block !important;
            }

            .logo-container {
                width: 100% !important;
                justify-content: space-between !important;
            }

            .top-nav {
                flex-direction: column !important;
                align-items: flex-start !important;
            }

            .top-nav ul {
                display: none !important;
            }

            .top-nav>div:last-child {
                display: none !important;
            }

            .top-nav.menu-open ul {
                display: flex !important;
                flex-direction: column !important;
                width: 100%;
                border-radius: 0.5rem;
                background: #fff;
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
                padding: 0.5rem 0 !important;
                gap: 0 !important;
                margin-top: 1rem;
                max-height: 70vh;
                /* Prevent it from going offscreen */
                overflow-y: auto;
                /* Scrollable if too many items */
            }

            .top-nav.menu-open ul li {
                width: 100%;
                border-bottom: 1px solid #f1f5f9;
                text-align: center;
            }

            .top-nav.menu-open ul li a {
                display: block !important;
                padding: 1rem !important;
            }

            .metric-cards,
            .dashboard-grid,
            .client-summary,
            .finance-summary,
            .stats-grid,
            .summary-container {
                grid-template-columns: 1fr !important;
                gap: 1rem !important;
                display: grid !important;
            }
        }
    </style>
</head>


<body style="display: none;">
    <nav class="top-nav">
        <div class="logo-container"
            style="display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:0;">
            <div style="display:flex; align-items:center; gap:0.5rem; flex-shrink:0; cursor:pointer;"
                onclick="location.href='dashboard.html'">
                <img src="../images/logo/logo.png" style="height: 28px;" onerror="this.style.display='none';">
                <h1 style="margin:0; font-size: 1.3rem; color: #4F46E5; font-weight: 800; white-space:nowrap;">AI경영관리
                </h1>
            </div>
            <div class="mobile-only-btn" style="display:none; cursor:pointer;"
                onclick="document.querySelector('.top-nav').classList.toggle('menu-open')">
                <svg viewBox="0 0 24 24" width="28" height="28" stroke="#4F46E5" stroke-width="2" fill="none">
                    <path d="M3 12h18M3 6h18M3 18h18" />
                </svg>
            </div>
        </div>
        <ul>
            <li><a href="dashboard.html">대시보드</a></li>
            <li class="dropdown">
                <span class="dropbtn">내부운영(HR) ▾</span>
                <div class="dropdown-content">
                    <a href="tasks.html">업무지시/보고</a>
                    <a href="finance.html">재무/회계</a>
                    <a href="employees.html">직원목록</a>
                </div>
            </li>
            <li class="dropdown">
                <span class="dropbtn">영업/프로젝트 ▾</span>
                <div class="dropdown-content">
                    <a href="projects.html">프로젝트 보드</a>
                    <a href="materials.html">자재관리</a>
                    <a href="suppliers.html">협력업체</a>
                </div>
            </li>
            <li class="dropdown">
                <span class="dropbtn">고객/회원관리 ▾</span>
                <div class="dropdown-content">
                    <a href="clients.html">고객 리스트</a>
                    <a href="contacts.html">인맥(명함)</a>
                    <a href="users.html">SaaS 회원관리</a>
                </div>
            </li>
        </ul>
        <div style="font-size: 0.85rem; text-align: right;" id="navUserEmail">
        </div>
    </nav>

    <main class="container" style="padding: 2rem 1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h2>담당자 및 권한 설정</h2>
            <button class="btn-primary" onclick="window.inviteNewUser()">+ 새 권한 부여</button>
        </div>

        <div class="card" style="margin-bottom: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
                <div>
                    <h3>활성 담당자 목록</h3>
                    <p style="color: var(--text-secondary); margin-bottom: 0; font-size: 0.875rem;">
                        시스템에 접근 가능한 사용자와 관리 카테고리를 지정할 수 있습니다.
                    </p>
                </div>
                <div>
                    <input type="text" id="userSearchInput" placeholder="이메일 또는 이름 검색..."
                        style="padding: 0.5rem 1rem; border-radius: 4px; border: 1px solid var(--border-color); width: 250px; outline: none; transition: border-color 0.2s;">
                </div>
            </div>

            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="border-bottom: 2px solid var(--border-color);">
                        <th style="padding: 1rem;">담당자 명/이메일</th>
                        <th style="padding: 1rem;">시스템 권한</th>
                        <th style="padding: 1rem;">담당 카테고리</th>
                        <th style="padding: 1rem;">상태</th>
                        <th style="padding: 1rem;">권한 변경</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr>
                        <td colspan="5" style="text-align:center; padding: 1rem; color: var(--text-secondary);">
                            데이터를 불러오는 중...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module" src="../assets/js/firebase-config.js"></script>
    <script type="module">
        import { checkAdminAuth } from '../assets/js/auth.js';
        import { db } from '../assets/js/firebase-config.js';
        import { collection, getDocs, updateDoc, doc, addDoc, deleteDoc } from 'firebase/firestore';

        window.updateUserRole = async (userId, currentRole) => {
            const newRole = prompt(`새로운 권한을 입력하세요 (SUPER_ADMIN, ADMIN, STAFF, VIEWER)\n현재 권한: ${currentRole}`, currentRole);
            if (newRole && ['SUPER_ADMIN', 'ADMIN', 'STAFF', 'VIEWER'].includes(newRole.toUpperCase())) {
                try {
                    await updateDoc(doc(db, 'users', userId), { role: newRole.toUpperCase(), status: '승인됨' });
                    alert('권한이 성공적으로 변경되었습니다.');
                    location.reload();
                } catch (e) {
                    alert('권한 유지 정보 수정 중 오류가 발생했습니다: ' + e.message);
                }
            } else if (newRole) {
                alert('유효하지 않은 권한입니다.');
            }
        };

        window.deleteUser = async (userId, email) => {
            if (email === 'daguri75@gmail.com') {
                alert('최고 관리자(CEO) 계정은 삭제할 수 없습니다!');
                return;
            }
            if (confirm(`정말로 [${email}] 사용자의 권한 및 데이터를 삭제하시겠습니까?\n이후 접속 시 다시 대기중인 GUEST 상태로 돌아갑니다.`)) {
                try {
                    await deleteDoc(doc(db, 'users', userId));
                    alert('사용자 데이터가 삭제(접근 차단) 처리되었습니다.');
                    location.reload();
                } catch (e) {
                    alert('삭제 중 오류 발생: ' + e.message);
                }
            }
        };

        window.inviteNewUser = async () => {
            const email = prompt("권한을 부여할 새 담당자의 구글 계정(이메일)을 입력하세요:");
            if (!email || email.trim() === '') return;

            const position = prompt("직급 또는 역할명을 입력하세요 (예: 이과장, 외주업체 등):", "담당자");
            const role = prompt("시스템 권한 등급을 입력하세요 (예: ADMIN, STAFF, VIEWER):", "STAFF");

            if (email && role) {
                try {
                    await addDoc(collection(db, 'users'), {
                        email: email.trim(),
                        name: position,
                        position: position || 'N/A',
                        role: role.toUpperCase(),
                        status: '승인됨',
                        createdAt: new Date()
                    });
                    alert(`[${email}] 계정이 ${role.toUpperCase()} 권한으로 시스템에 등록되었습니다!`);
                    location.reload();
                } catch (e) {
                    alert('사용자 등록 실패: ' + e.message);
                }
            }
        };

        let loadedUsers = [];

        function renderUsersTable(users) {
            const tbody = document.getElementById('usersTableBody');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:1rem; color:var(--text-secondary);">검색 결과가 없습니다.</td></tr>';
                return;
            }

            let html = '';
            users.forEach(data => {
                const role = data.role || 'VIEWER';
                const status = data.status || '대기중';
                const category = data.category || '전체 조회';

                let badgeClass = 'role-viewer';
                if (role === 'SUPER_ADMIN') badgeClass = 'role-super';
                else if (role === 'ADMIN') badgeClass = 'role-admin';
                else if (role === 'STAFF') badgeClass = 'role-staff';

                html += `
                    <tr>
                        <td style="padding: 1rem; font-weight: 500;">${data.name || data.position || '이름 없음'} (${data.email || '이메일 없음'})</td>
                        <td style="padding: 1rem;"><span class="role-badge ${badgeClass}">${role}</span></td>
                        <td style="padding: 1rem;">${category}</td>
                        <td style="padding: 1rem; color: ${status === '대기중' ? '#94a3b8' : 'inherit'}">${status}</td>
                        <td style="padding: 1rem;">
                            <div style="display: flex; gap: 0.5em;">
                                <button class="btn-primary" style="padding:0.25rem 0.5rem;" onclick="window.updateUserRole('${data.id}', '${role}')">설정</button>
                                <button class="btn-primary" style="padding:0.25rem 0.5rem; background:#ef4444;" onclick="window.deleteUser('${data.id}', '${data.email}')">삭제</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        checkAdminAuth(
            async (user) => {
                // Fetch data
                try {
                    document.body.style.display = 'block';
                    const querySnapshot = await getDocs(collection(db, 'users'));

                    querySnapshot.forEach((docRef) => {
                        loadedUsers.push({ id: docRef.id, ...docRef.data() });
                    });

                    renderUsersTable(loadedUsers);

                    // Add search functionality
                    document.getElementById('userSearchInput').addEventListener('input', (e) => {
                        const target = e.target.value.toLowerCase();
                        if (!target) {
                            renderUsersTable(loadedUsers);
                        } else {
                            const filtered = loadedUsers.filter(u =>
                                (u.email && u.email.toLowerCase().includes(target)) ||
                                (u.name && u.name.toLowerCase().includes(target)) ||
                                (u.position && u.position.toLowerCase().includes(target))
                            );
                            renderUsersTable(filtered);
                        }
                    });

                } catch (error) {
                    console.error("Error fetching users:", error);
                    document.getElementById('usersTableBody').innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 1rem; color: red;">데이터를 불러오는 중 오류가 발생했습니다.</td></tr>';
                }

                // Add user header
                const nav = document.querySelector('.main-nav ul');
                if (nav && !document.getElementById('navUserEmail')) {
                    const li = document.createElement('li');
                    li.id = 'navUserEmail';
                    li.innerHTML = `<span style="margin-left: 1rem; font-size:0.875rem; color:var(--text-secondary);">${user.email}</span>
                                    <button onclick="window.logoutAndRedirect()" style="margin-left:0.5rem; background:none; border:none; cursor:pointer; color:var(--primary-color); font-weight:bold;">[로그아웃]</button>`;
                    nav.appendChild(li);
                }
            },
            () => {
                const current = window.location.pathname + window.location.search;
                window.location.href = '../login.html?redirect=' + encodeURIComponent(current);
            }
        );

        import { logoutAdmin } from '../assets/js/auth.js';
        window.logoutAndRedirect = () => {
            logoutAdmin();
            window.location.href = '../login.html';
        };
    </script>
    <script type="module" src="../assets/js/ai-chat.js"></script>
<script>
            function highlightActiveMenu() {
                const current = location.pathname.split('/').pop() || 'dashboard.html';
                document.querySelectorAll('.top-nav a').forEach(a => {
                    const href = a.getAttribute('href');
                    if (href && href === current) {
                        a.style.color = 'var(--primary-color, #4F46E5)';
                        a.style.fontWeight = '700';
                        const parentDropBtn = a.closest('.dropdown');
                        if (parentDropBtn) {
                            parentDropBtn.querySelector('.dropbtn').style.color = 'var(--primary-color, #4F46E5)';
                            parentDropBtn.querySelector('.dropbtn').style.background = 'rgba(79, 70, 229, 0.05)';
                        }
                    } else if (a.classList.contains('active') && href !== current) {
                        a.classList.remove('active');
                    }
                });
            }
            document.addEventListener('DOMContentLoaded', highlightActiveMenu);
        </script></body>

</html>
