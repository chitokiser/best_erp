    <script type="module" src="../assets/js/firebase-config.js"></script>
    <script type="module">
        import { checkAdminAuth } from '../assets/js/auth.js';
        import { db } from '../assets/js/firebase-config.js';
        import { collection, getDocs, updateDoc, doc, addDoc } from 'firebase/firestore';

        window.updateUserRole = async (userId, currentRole) => {
            const newRole = prompt(`?덈줈??沅뚰븳???낅젰?섏꽭??(SUPER_ADMIN, ADMIN, STAFF, VIEWER)\n?꾩옱 沅뚰븳: ${currentRole}`, currentRole);
            if (newRole && ['SUPER_ADMIN', 'ADMIN', 'STAFF', 'VIEWER'].includes(newRole.toUpperCase())) {
                try {
                    await updateDoc(doc(db, 'users', userId), { role: newRole.toUpperCase(), status: '?뱀씤?? });
                    alert('沅뚰븳???깃났?곸쑝濡?蹂寃쎈릺?덉뒿?덈떎.');
                    location.reload();
                } catch (e) {
                    alert('沅뚰븳 ?좎? ?뺣낫 ?섏젙 以??ㅻ쪟媛 諛쒖깮?덉뒿?덈떎: ' + e.message);
                }
            } else if (newRole) {
                alert('?좏슚?섏? ?딆? 沅뚰븳?낅땲??');
            }
        };

        window.inviteNewUser = async () => {
            const email = prompt("沅뚰븳??遺?ы븷 ???대떦?먯쓽 援ш? 怨꾩젙(?대찓?????낅젰?섏꽭??");
            if (!email || email.trim() === '') return;

            const position = prompt("吏곴툒 ?먮뒗 ??븷紐낆쓣 ?낅젰?섏꽭??(?? ?닿낵?? ?몄＜?낆껜 ??:", "?대떦??);
            const role = prompt("?쒖뒪??沅뚰븳 ?깃툒???낅젰?섏꽭??(?? ADMIN, STAFF, VIEWER):", "STAFF");

            if (email && role) {
                try {
                    await addDoc(collection(db, 'users'), {
                        email: email.trim(),
                        name: position,
                        position: position || 'N/A',
                        role: role.toUpperCase(),
                        status: '?뱀씤??,
                        createdAt: new Date()
                    });
                    alert(`[${email}] 怨꾩젙??${role.toUpperCase()} 沅뚰븳?쇰줈 ?쒖뒪?쒖뿉 ?깅줉?섏뿀?듬땲??`);
                    location.reload();
                } catch (e) {
                    alert('?ъ슜???깅줉 ?ㅽ뙣: ' + e.message);
                }
            }
        };

        let loadedUsers = [];

        function renderUsersTable(users) {
            const tbody = document.getElementById('usersTableBody');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:1rem; color:var(--text-secondary);">寃??寃곌낵媛 ?놁뒿?덈떎.</td></tr>';
                return;
            }

            let html = '';
            users.forEach(data => {
                const role = data.role || 'VIEWER';
                const status = data.status || '?湲곗쨷';
                const category = data.category || '?꾩껜 議고쉶';

                let badgeClass = 'role-viewer';
                if (role === 'SUPER_ADMIN') badgeClass = 'role-super';
                else if (role === 'ADMIN') badgeClass = 'role-admin';
                else if (role === 'STAFF') badgeClass = 'role-staff';

                html += `
                    <tr>
                        <td style="padding: 1rem; font-weight: 500;">${data.name || data.position || '?대쫫 ?놁쓬'} (${data.email || '?대찓???놁쓬'})</td>
                        <td style="padding: 1rem;"><span class="role-badge ${badgeClass}">${role}</span></td>
                        <td style="padding: 1rem;">${category}</td>
                        <td style="padding: 1rem; color: ${status === '?湲곗쨷' ? '#94a3b8' : 'inherit'}">${status}</td>
                        <td style="padding: 1rem;">
                            <button class="btn-primary" style="padding:0.25rem 0.5rem;" onclick="window.updateUserRole('${data.id}', '${role}')">?ㅼ젙</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        checkAdminAuth(
            async (user) => {
                // Fetch data
                try {
                    document.body.style.display = 'block';
                    const querySnapshot = await getDocs(collection(db, 'users'));

                    querySnapshot.forEach((docRef) => {
                        loadedUsers.push({ id: docRef.id, ...docRef.data() });
                    });

                    renderUsersTable(loadedUsers);

                    // Add search functionality
                    document.getElementById('userSearchInput').addEventListener('input', (e) => {
                        const target = e.target.value.toLowerCase();
                        if (!target) {
                            renderUsersTable(loadedUsers);
                        } else {
                            const filtered = loadedUsers.filter(u =>
                                (u.email && u.email.toLowerCase().includes(target)) ||
                                (u.name && u.name.toLowerCase().includes(target)) ||
                                (u.position && u.position.toLowerCase().includes(target))
                            );
                            renderUsersTable(filtered);
                        }
                    });

                } catch (error) {
                    console.error("Error fetching users:", error);
                    document.getElementById('usersTableBody').innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 1rem; color: red;">?곗씠?곕? 遺덈윭?ㅻ뒗 以??ㅻ쪟媛 諛쒖깮?덉뒿?덈떎.</td></tr>';
                }

                // Add user header
                const nav = document.querySelector('.main-nav ul');
                if (nav && !document.getElementById('navUserEmail')) {
                    const li = document.createElement('li');
                    li.id = 'navUserEmail';
                    li.innerHTML = `<span style="margin-left: 1rem; font-size:0.875rem; color:var(--text-secondary);">${user.email}</span>
                                    <button onclick="window.logoutAndRedirect()" style="margin-left:0.5rem; background:none; border:none; cursor:pointer; color:var(--primary-color); font-weight:bold;">[濡쒓렇?꾩썐]</button>`;
                    nav.appendChild(li);
                }
            },
            () => {
                const current = window.location.pathname + window.location.search;
                window.location.href = '../login.html?redirect=' + encodeURIComponent(current);
            }
        );

        import { logoutAdmin } from '../assets/js/auth.js';
        window.logoutAndRedirect = () => {
            logoutAdmin();
            window.location.href = '../login.html';
        };
    </script>
