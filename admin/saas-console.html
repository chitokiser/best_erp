<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👑 Super Admin SaaS 전체 가맹점 관제판 | BestERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
  <style>
    .con-wrap { max-width: 1180px; margin: 22px auto; padding: 0 16px 48px; }
    .con-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    .con-kpi { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; box-shadow: 0 2px 10px rgba(15,23,42,.04); }
    .con-kpi span { font-size: 0.78rem; color: #64748b; font-weight: 700; display: block; }
    .con-kpi strong { font-size: 1.5rem; font-weight: 900; color: #0f172a; }
    .con-table-wrap { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; overflow-x: auto; box-shadow: 0 4px 16px rgba(15,23,42,.05); }
    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    th, td { padding: 12px 14px; border-bottom: 1px solid #f1f5f9; text-align: left; white-space: nowrap; }
    th { background: #f8fafc; color: #475569; font-weight: 800; font-size: 0.78rem; }
    .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 0.74rem; font-weight: 800; }
    .pill-active { background: #dcfce7; color: #15803d; }
    .pill-suspended { background: #fee2e2; color: #b91c1c; }
    .sel-sm { padding: 5px 8px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.8rem; font-weight: 700; }
    .btn-sm { padding: 6px 10px; border-radius: 8px; border: none; font-size: 0.78rem; font-weight: 800; cursor: pointer; text-decoration: none; display: inline-block; }
    @media (max-width: 780px) { .con-kpis { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body class="admin-body">
  <div class="con-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
      <div>
        <a href="dashboard.html" style="font-size:0.84rem;color:#4f46e5;font-weight:700;text-decoration:none;">← 대시보드로 돌아가기</a>
        <h2 style="margin:6px 0 0;font-size:1.45rem;font-weight:900;">👑 Super Admin SaaS 전체 가맹점 관제판</h2>
      </div>
      <div style="display:flex;gap:8px;">
        <a href="../onboarding.html" class="btn-sm" style="background:#4f46e5;color:#fff;padding:8px 14px;">+ 신규 가맹점 개설</a>
        <button type="button" id="btnReloadConsole" class="btn-sm" style="background:#0f172a;color:#fff;padding:8px 14px;">🔄 새로고침</button>
      </div>
    </div>

    <div class="con-kpis">
      <div class="con-kpi"><span>총 입점 가맹점</span><strong id="kpiTotal">0</strong></div>
      <div class="con-kpi"><span>정상 운영 중</span><strong id="kpiActive" style="color:#059669;">0</strong></div>
      <div class="con-kpi"><span>Pro / Enterprise 구독</span><strong id="kpiPaid" style="color:#4f46e5;">0</strong></div>
      <div class="con-kpi"><span>전체 등록 상품 수</span><strong id="kpiProducts" style="color:#d97706;">0</strong></div>
    </div>

    <div class="con-table-wrap">
      <table>
        <thead>
          <tr>
            <th>가맹점명 / ID</th>
            <th>대표 이메일</th>
            <th>구독 플랜</th>
            <th>상태</th>
            <th>등록 상품</th>
            <th>1 BT 기준</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="merchantTableBody">
          <tr><td colspan="7" style="text-align:center;padding:30px;color:#64748b;">가맹점 목록을 불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { checkAdminAuth } from '../assets/js/auth.js';
    import { isSuperAdminUser } from '../assets/js/tenant-router.js';
    import { db } from '../assets/js/firebase-config.js';
    import { collection, getDocs, doc, updateDoc, serverTimestamp } from 'firebase/firestore';

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    async function loadAllTenants() {
      const tbody = document.getElementById('merchantTableBody');
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:#64748b;">불러오는 중...</td></tr>';

      const [mSnap, pSnap] = await Promise.all([
        getDocs(collection(db, 'merchants')),
        getDocs(collection(db, 'merchant_products')),
      ]);

      const prodCounts = {};
      pSnap.forEach((d) => {
        const mid = String(d.data()?.merchant_id || '');
        if (mid) prodCounts[mid] = (prodCounts[mid] || 0) + 1;
      });

      const list = [];
      mSnap.forEach((d) => list.push({ id: d.id, ...d.data() }));
      list.sort((a, b) => (b.updatedAt?.seconds || 0) - (a.updatedAt?.seconds || 0));

      const activeCnt = list.filter((m) => m.saasStatus !== 'suspended').length;
      const paidCnt = list.filter((m) => ['pro', 'enterprise'].includes(String(m.saasPlan || '').toLowerCase())).length;

      document.getElementById('kpiTotal').textContent = String(list.length);
      document.getElementById('kpiActive').textContent = String(activeCnt);
      document.getElementById('kpiPaid').textContent = String(paidCnt);
      document.getElementById('kpiProducts').textContent = String(pSnap.size);

      if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:#64748b;">등록된 가맹점이 없습니다.</td></tr>';
        return;
      }

      tbody.innerHTML = list.map((m) => {
        const plan = String(m.saasPlan || 'starter').toLowerCase();
        const suspended = m.saasStatus === 'suspended';
        const pCount = prodCounts[String(m.id)] || 0;
        const slug = m.slug || m.id;
        return `
          <tr>
            <td><strong>${esc(m.name || m.storeName || '이름 없음')}</strong><br/><small style="color:#64748b;">ID: ${esc(m.id)}</small></td>
            <td>${esc(m.ownerEmail || '-')}</td>
            <td>
              <select class="sel-sm" data-plan-id="${esc(m.id)}">
                <option value="starter" ${plan === 'starter' ? 'selected' : ''}>Starter</option>
                <option value="pro" ${plan === 'pro' ? 'selected' : ''}>Pro</option>
                <option value="enterprise" ${plan === 'enterprise' ? 'selected' : ''}>Enterprise</option>
              </select>
            </td>
            <td><span class="pill ${suspended ? 'pill-suspended' : 'pill-active'}">${suspended ? '일시정지' : '정상 운영'}</span></td>
            <td><strong>${pCount}개</strong></td>
            <td>${Number(m.btPerVnd || 100000).toLocaleString()}₫</td>
            <td style="display:flex;gap:6px;">
              <a href="dashboard.html?store=${encodeURIComponent(slug)}" class="btn-sm" style="background:#eef2ff;color:#4f46e5;">대시보드 →</a>
              <button type="button" class="btn-sm" data-toggle-id="${esc(m.id)}" data-suspended="${suspended ? '1' : '0'}" style="background:${suspended ? '#dcfce7' : '#fee2e2'};color:${suspended ? '#15803d' : '#b91c1c'};">
                ${suspended ? '재개' : '정지'}
              </button>
            </td>
          </tr>`;
      }).join('');

      tbody.querySelectorAll('[data-plan-id]').forEach((sel) => {
        sel.addEventListener('change', async () => {
          const mid = sel.dataset.planId;
          await updateDoc(doc(db, 'merchants', mid), { saasPlan: sel.value, updatedAt: serverTimestamp() });
          loadAllTenants();
        });
      });

      tbody.querySelectorAll('[data-toggle-id]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const mid = btn.dataset.toggleId;
          const isSusp = btn.dataset.suspended === '1';
          if (!confirm(`가맹점(${mid}) 상태를 '${isSusp ? '정상 운영' : '일시정지'}'으로 변경할까요?`)) return;
          await updateDoc(doc(db, 'merchants', mid), { saasStatus: isSusp ? 'active' : 'suspended', updatedAt: serverTimestamp() });
          loadAllTenants();
        });
      });
    }

    checkAdminAuth(() => {
      if (!isSuperAdminUser()) {
        alert('최고 관리자(Super Admin) 전용 페이지입니다.');
        location.replace('dashboard.html');
        return;
      }
      loadAllTenants();
    });

    document.getElementById('btnReloadConsole').addEventListener('click', loadAllTenants);
  </script>
</body>
</html>
