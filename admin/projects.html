<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 관리 - AI CEO MANAGER</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        :root {
            --ai-primary: #4F46E5;
            --ai-secondary: #818CF8;
            --ai-gradient: linear-gradient(135deg, #4F46E5, #7C3AED);
            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
            --vip: #8B5CF6;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --bg-glass: rgba(255, 255, 255, 0.85);
        }

        body {
            background: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-dark);
            display: none;
            /* auth check 시 보이게 변경 */
        }

        .top-nav {
            background: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .top-nav h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--ai-primary);
            font-weight: 800;
        }

        .top-nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
            margin: 0;
            padding: 0;
        }

        .top-nav a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .top-nav a:hover,
        .top-nav a.active {
            color: var(--ai-primary);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .panel {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .panel-header h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .btn-primary {
            background: var(--ai-gradient);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th,
        td {
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            font-weight: 700;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        td {
            font-size: 0.95rem;
        }

        .badge-status {
            background: #e0f2fe;
            color: #0369a1;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    
        .dropdown { position: relative; display: inline-block; margin-top:2px; }
        .dropdown-content { display: none; position: absolute; background-color: white; min-width: 180px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-radius: 0.5rem; border: 1px solid #e2e8f0; z-index: 1000; overflow: hidden; top:100%; left:0; }
        .dropdown-content a { color: #334155 !important; padding: 0.8rem 1rem !important; text-decoration: none; display: block; font-size: 0.95rem; font-weight: 500; border-bottom: 1px solid #f1f5f9; transition: all 0.2s; white-space: nowrap; }
        .dropdown-content a:last-child { border-bottom: none; }
        .dropdown-content a:hover { background-color: #f8fafc; color: #4F46E5 !important; padding-left: 1.25rem !important; }
        .dropdown:hover .dropdown-content { display: block; animation: fadeInUp 0.2s ease-out; }
        .dropbtn { padding: 0.5rem 0.75rem; color: #475569; font-weight: 600; cursor: pointer; border-radius: 0.5rem; transition: background 0.2s; display:inline-block; }
        .dropdown:hover .dropbtn { color: #4F46E5; background: rgba(79, 70, 229, 0.05); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>

    <!-- FORCE CSS -->
<style>
    .top-nav { display: flex; align-items: center; justify-content: space-between; flex-wrap: nowrap; overflow: visible; position: relative; }
    .logo-container { width: auto !important; }
    .top-nav ul { display: flex; align-items: center; gap: 1rem; list-style: none; margin: 0; padding: 0; flex-wrap: nowrap !important; }
    .top-nav ul li a { white-space: nowrap !important; }
    .mobile-only-btn { display: none !important; }
    
    @media screen and (max-width: 900px) {
        .mobile-only-btn { display: block !important; }
        .logo-container { width: 100% !important; justify-content: space-between !important; }
        .top-nav { flex-direction: column !important; align-items: flex-start !important; }
        .top-nav ul { display: none !important; }
        .top-nav > div:last-child { display: none !important; }
        
        .top-nav.menu-open ul { 
            display: flex !important; flex-direction: column !important; 
            width: 100%; border-radius: 0.5rem; background:#fff; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); padding: 0.5rem 0 !important; gap: 0 !important;
            margin-top: 1rem;
            max-height: 70vh; /* Prevent it from going offscreen */
            overflow-y: auto; /* Scrollable if too many items */
        }
        .top-nav.menu-open ul li { width: 100%; border-bottom: 1px solid #f1f5f9; text-align:center; }
        .top-nav.menu-open ul li a { display: block !important; padding: 1rem !important; }
        
        .metric-cards, .dashboard-grid, .client-summary, .finance-summary, .stats-grid, .summary-container { 
            grid-template-columns: 1fr !important; gap: 1rem !important; display: grid !important;
        }
    }
</style>
        <link rel="stylesheet" href="../assets/css/admin.css">
</head>
    

<body>
    <!-- Navigation -->
        <nav class="top-nav">
        <div class="nav-header-bar">
            <div class="nav-brand">
                <h1 class="brand-edit-badge" onclick="location.href='dashboard.html'" title="대시보드로 이동">
                    <span style="color:#ef4444;" class="dynamic-brand-text" id="dynamicStoreName">가맹점(로딩중)</span>
                    <span style="color:var(--text-primary); font-size:1.15rem; font-weight:700;">M-SaaS</span>
                </h1>
            </div>
            <button class="mobile-nav-toggle" onclick="toggleNavMenu()" aria-label="메뉴 열기">
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
                    <path d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <ul id="navMenuList">
            <li><a href="dashboard.html">CEO 대시보드</a></li>
            <li class="dropdown" onclick="toggleDropdown(this, event)">
                <span class="dropbtn">매장 관리(F&B) ▾</span>
                <div class="dropdown-content">
                    <a href="menus.html">스마트 메뉴 관리</a>
                </div>
            </li>
            <li class="dropdown" onclick="toggleDropdown(this, event)">
                <span class="dropbtn">영업/프로젝트 ▾</span>
                <div class="dropdown-content">
                    <a href="projects.html">프로젝트 보드</a>
                    <a href="materials.html">자재관리</a>
                    <a href="suppliers.html">협력업체</a>
                </div>
            </li>
            <li class="dropdown" onclick="toggleDropdown(this, event)">
                <span class="dropbtn">내부운영(HR) ▾</span>
                <div class="dropdown-content">
                    <a href="tasks.html">업무지시/보고</a>
                    <a href="finance.html">재무/회계</a>
                    <a href="employees.html">직원목록</a>
                </div>
            </li>
            <li class="dropdown" onclick="toggleDropdown(this, event)">
                <span class="dropbtn">고객/회원관리 ▾</span>
                <div class="dropdown-content">
                    <a href="clients.html">멘티(고객) CRM</a>
                    <a href="contacts.html">인맥(명함)</a>
                    <a href="marketing.html">자동 마케팅(트리거)</a>
                    <a href="users.html">SaaS 회원관리</a>
                </div>
            </li>
        </ul>
        <div id="navUserEmail" style="display:none;"></div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <div class="panel">
            <div class="panel-header">
                <h2>프로젝트 (현장) 관리</h2>
                <button class="btn-primary" onclick="window.createProject()">+ 새 프로젝트 파트너 할당</button>
            </div>

            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr>
                        <th>프로젝트 명</th>
                        <th>진행 단계</th>
                        <th>담당자(PM)</th>
                        <th>종료 예정일</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="projectsTableBody">
                    <tr>
                        <td colspan="5" style="text-align:center; padding: 2rem; color: var(--text-muted);">
                            데이터를 불러오는 중...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module">
        import { checkAdminAuth, logoutAdmin } from '../assets/js/auth.js';
        import { db } from '../assets/js/firebase-config.js';
        import { collection, getDocs, addDoc } from 'firebase/firestore';

        window.logoutAndRedirect = () => {
            logoutAdmin();
        };

        window.createProject = async () => {
            const title = prompt("새로운 프로젝트(공사 현장) 이름을 입력하세요:");
            if (!title) return;
            const pmEmail = prompt("이 프로젝트를 담당할 PM(담당자)의 이메일을 입력하세요 (예: kfu134252@gmail.com):");
            if (!pmEmail) return;

            try {
                const docRef = await addDoc(collection(db, 'projects'), {
                    title: title,
                    status: '착공대기',
                    pm: pmEmail,
                    createdAt: new Date(),
                    deadline: 'N/A'
                });
                alert('프로젝트가 성공적으로 생성 및 할당되었습니다!');
                window.location.href = `project-detail.html?id=${docRef.id}`;
            } catch (e) {
                alert('프로젝트 생성 실패: ' + e.message);
            }
        };

        checkAdminAuth(
            async (user) => {
                document.body.style.display = 'block';
                const elEmail = document.getElementById('currentUserEmail') || document.getElementById('navUserEmailSpan');
                if (elEmail) elEmail.textContent = user.email;

                const tbody = document.getElementById('projectsTableBody');

                // Load Projects
                try {
                    // Fetch Users to map email -> name
                    const usersSnap = await getDocs(collection(db, 'users')).catch(() => ({ forEach: () => {} }));
                    const emailToName = {};
                    usersSnap.forEach(uDoc => {
                        const ud = uDoc.data();
                        if(ud.email && ud.name) {
                            emailToName[ud.email] = ud.name;
                        }
                    });

                    const querySnapshot = await getDocs(collection(db, 'projects'));
                    if (querySnapshot.empty) {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 2rem; color: var(--text-muted);">생성된 프로젝트가 없습니다.</td></tr>';
                        return;
                    }

                    let html = '';
                    querySnapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        const id = docSnap.id;
                        const pmEmail = data.pm || '미지정';
                        const pmName = emailToName[pmEmail] ? emailToName[pmEmail] : pmEmail;
                        html += `
                            <tr>
                                <td style="padding: 1rem; font-weight: 600;">
                                    <a href="project-detail.html?id=${id}" style="color:var(--ai-primary); text-decoration:none;">${data.title || '무제 프로젝트'}</a>
                                </td>
                                <td style="padding: 1rem;">
                                    <span class="badge-status">
                                        ${data.status || '착공대기'}
                                    </span>
                                </td>
                                <td style="padding: 1rem;">${pmName}</td>
                                <td style="padding: 1rem; color: var(--text-muted);">${data.deadline || 'N/A'}</td>
                                <td style="padding: 1rem;">
                                    <button class="btn-primary" style="padding:0.4rem 0.8rem; font-size: 0.85rem;" onclick="location.href='project-detail.html?id=${id}'">칸반 열기</button>
                                </td>
                            </tr>
                        `;
                    });
                    tbody.innerHTML = html;
                } catch (e) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 2rem; color: var(--danger);">오류가 발생했습니다.</td></tr>`;
                    console.error(e);
                }
            },
            () => {
                window.location.href = '../login.html';
            }
        );
    </script>
    <script type="module" src="../assets/js/ai-chat.js"></script>
<script>
            function highlightActiveMenu() {
                const current = location.pathname.split('/').pop() || 'dashboard.html';
                document.querySelectorAll('.top-nav a').forEach(a => {
                    const href = a.getAttribute('href');
                    if (href && href === current) {
                        a.style.color = 'var(--primary-color, #4F46E5)';
                        a.style.fontWeight = '700';
                        const parentDropBtn = a.closest('.dropdown');
                        if (parentDropBtn) {
                            parentDropBtn.querySelector('.dropbtn').style.color = 'var(--primary-color, #4F46E5)';
                            parentDropBtn.querySelector('.dropbtn').style.background = 'rgba(79, 70, 229, 0.05)';
                        }
                    } else if (a.classList.contains('active') && href !== current) {
                        a.classList.remove('active');
                    }
                });
            }
            document.addEventListener('DOMContentLoaded', highlightActiveMenu);
        </script></body>

</html>
