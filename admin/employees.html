<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 직원 DB 관리 - BESTwinner</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ai-primary: #4F46E5;
            --ai-secondary: #818CF8;
            --ai-gradient: linear-gradient(135deg, #4F46E5, #7C3AED);
            --danger: #EF4444;
            --warning: #F59E0B;
            --success: #10B981;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --text-dark: #1E293B;
            --text-muted: #64748B;
        }

        body {
            background: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text-dark);
        }

        .main-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .header-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .header-action h2 {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0;
        }

        .btn-add {
            background: var(--ai-gradient);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-add:hover {
            transform: translateY(-2px);
        }

        .data-card {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 1rem;
            border-bottom: 2px solid #e2e8f0;
            color: var(--text-muted);
            font-weight: 600;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid #f1f5f9;
        }

        .skill-tag {
            background: #e0e7ff;
            color: #4338ca;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.8rem;
            margin-right: 0.25rem;
            font-weight: 500;
        }

        .workload-high {
            color: var(--danger);
            font-weight: bold;
        }

        .workload-ok {
            color: var(--success);
            font-weight: bold;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            width: 500px;
            max-width: 90%;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 1.25rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        .form-row {
            display: flex;
            gap: 1rem;
        }

        .form-row .form-group {
            flex: 1;
        }

        .submit-btn {
            background: var(--text-dark);
            color: white;
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            margin-top: 1rem;
            cursor: pointer;
        }

        .top-nav {
            background: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .top-nav h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--ai-primary, #4F46E5);
            font-weight: 800;
        }

        .top-nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
            margin: 0;
            padding: 0;
        }

        .top-nav a {
            text-decoration: none;
            color: var(--text-muted, #64748B);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .top-nav a:hover,
        .top-nav a.active {
            color: var(--ai-primary, #4F46E5);
        }
    </style>
</head>

<body style="display: none;">
    <nav class="top-nav">
        <div class="logo-container" style="display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:0;">
            <div style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;" onclick="location.href='dashboard.html'">
                <img src="../images/logo/logo.png" style="height: 28px;" onerror="this.style.display='none';">
                <h1 style="margin:0; font-size: 1.3rem; color: #4F46E5; font-weight: 800;">AI경영관리</h1>
            </div>
            <button id="hamburgerBtn" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:#4F46E5;" class="mobile-only">☰</button>
        </div>
        <ul>
            <li><a href="dashboard.html">대시보드</a></li>
            <li><a href="projects.html">프로젝트</a></li>
            <li><a href="materials.html">자재관리</a></li>
            <li><a href="suppliers.html">협력업체</a></li>
            <li><a href="purchase-requests.html">결재관리(구매)</a></li>
            <li><a href="finance.html">재무/회계</a></li>
            <li><a href="employees.html" class="active">직원</a></li>
            <li><a href="clients.html">고객</a></li>
            <li><a href="contacts.html">인맥</a></li>
        </ul>
        <div style="font-size: 0.85rem; text-align: right;">
            <strong style="color:var(--ai-primary, #4F46E5);" id="navUserEmailSpan">SUPER_ADMIN</strong><br>
            최고 관리자 <a href="#" onclick="window.logoutAndRedirect()" style="color:#2563eb;">[로그아웃]</a>
        </div>
    </nav>

    <div class="main-container">
        <div class="header-action">
            <h2>AI 분석용 직원 데이터</h2>
            <button class="btn-add" id="openModalBtn">+ 새 직원 등록</button>
        </div>

        <div class="data-card">
            <table>
                <thead>
                    <tr>
                        <th>이름/직급</th>
                        <th>부서</th>
                        <th>연락처</th>
                        <th>보유 기술(역량)</th>
                        <th>급여/평가</th>
                        <th>현재 업무량</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody id="empTableBody">
                    <tr>
                        <td colspan="5" style="text-align:center; padding:2rem; color:var(--text-muted);">로딩 중...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add Employee Modal -->
    <div class="modal-overlay" id="empModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalEmpTitle">직원 프로필 등록</h3><input type="hidden" id="empId" value="">
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <form id="empForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>이름</label>
                        <input type="text" id="empName" required placeholder="예: 김철수">
                    </div>
                    <div class="form-group">
                        <label>직급</label>
                        <input type="text" id="empPosition" required placeholder="예: 과장">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>부서</label>
                        <input type="text" id="empDept" required placeholder="예: 기술팀">
                    </div>
                    <div class="form-group">
                        <label>현재 업무량 (%)</label>
                        <input type="number" id="empWorkload" min="0" max="150" required placeholder="예: 85 (0~100)">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>월 급여 (VND)</label>
                        <input type="number" id="empSalary" placeholder="예: 25000000 (숫자만)"
                            style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.5rem; box-sizing: border-box;">
                    </div>
                    <div class="form-group">
                        <label>최근 인사평가</label>
                        <select id="empPerformance">
                            <option value="">평가 전</option>
                            <option value="S (최우수)">S (최우수)</option>
                            <option value="A (우수)">A (우수)</option>
                            <option value="B (보통)">B (보통)</option>
                            <option value="C (미흡)">C (미흡)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>이메일 / 연락처</label>
                    <input type="email" id="empContact" required placeholder="예: chulsoo@best.com">
                </div>
                <div class="form-group">
                    <label>보유 기술 및 전문분야 (쉼표로 구분)</label>
                    <input type="text" id="empSkills" placeholder="예: CAD, 현장소장, 자재관리">
                </div>
                <button type="submit" class="submit-btn" id="btnSubmit">저장하기</button>
            </form>
        </div>
    </div>

    <script type="module" src="../assets/js/employees.js"></script>

    <!-- Global Auth Guard -->
    <script type="module">
        import { checkAdminAuth, logoutAdmin } from '../assets/js/auth.js';

        checkAdminAuth(
            (user) => {
                document.body.style.display = 'block';

                // Update display email in our new top-nav
                const emailSpan = document.getElementById('navUserEmailSpan');
                if (emailSpan) {
                    emailSpan.textContent = user.email;
                }
            },
            () => {
                const current = window.location.pathname + window.location.search;
                window.location.href = '../login.html?redirect=' + encodeURIComponent(current);
            }
        );

        window.logoutAndRedirect = () => {
            logoutAdmin();
            window.location.href = '../login.html';
        };
    </script>
</body>

</html>
