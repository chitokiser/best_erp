    <main class="container" style="padding: 2rem 1rem;">
        <div style="display: flex; gap: 2rem; margin-bottom: 1.5rem; border-bottom: 1px solid #e2e8f0;">
            <a href="#" id="tab-all" onclick="window.switchTab('all')"
                style="text-decoration:none; color:var(--primary-color, #4F46E5); font-weight:bold; border-bottom:2px solid var(--primary-color, #4F46E5); padding-bottom:0.5rem;">전체
                자재 DB</a>
            <a href="#" id="tab-secured" onclick="window.switchTab('secured')"
                style="text-decoration:none; color:var(--text-secondary); font-weight:bold; padding-bottom:0.5rem;">보유
                자산 목록 (재고/확보분)</a>
            <a href="#" id="tab-logs" onclick="window.switchTab('logs')"
                style="text-decoration:none; color:var(--text-secondary); font-weight:bold; padding-bottom:0.5rem;">자재
                소모(반출) 내역</a>
        </div>

        <dialog id="consumeModal" class="card"
            style="border:none; border-radius:8px; padding:2rem; width:100%; max-width:400px;">
            <h3 style="margin-top:0">재고 소모 / 반출</h3>
            <p id="consumeItemName" style="font-weight:bold; margin-bottom: 1rem; color:var(--primary-color);"></p>
            <div style="margin-bottom:1rem">
                <label style="display:block; margin-bottom:0.5rem; font-size:0.9rem;">반출 수량 (현재: <span
                        id="consumeCurrentStock" style="color:red; font-weight:bold;"></span>개)</label>
                <input type="number" id="consumeQty" class="search-input" style="width:100%" min="1">
            </div>
            <div style="margin-bottom:1rem">
                <label style="display:block; margin-bottom:0.5rem; font-size:0.9rem;">사용처 / 대상 프로젝트명</label>
                <input type="text" id="consumeReason" class="search-input" style="width:100%"
                    placeholder="어디에 사용되는지 기재">
            </div>
            <div style="text-align:right; margin-top:2rem;">
                <button class="btn-primary" style="background:#64748b"
                    onclick="document.getElementById('consumeModal').close()">취소</button>
                <button class="btn-primary" style="background:#ef4444" id="btnConfirmConsume"
                    onclick="window.submitConsume()">소모 확정</button>
            </div>
        </dialog>

        <div
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
            <h2 id="viewTitle" style="margin:0;">전체 자재 목록</h2>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;">
                <input type="text" id="adminSearchFilter" class="search-input" placeholder="🔍 자재명 또는 코드 검색..."
                    style="padding: 0.5rem; width: 220px;">
                <select id="adminCatFilter" class="search-input" style="padding: 0.5rem;">
                    <option value="">모든 카테고리 ▼</option>
                    <option value="인테리어">인테리어</option>
                    <option value="엘리베이터">엘리베이터</option>
                    <option value="소방">소방</option>
                    <option value="스마트주차장">스마트주차장</option>
                    <option value="기타">기타</option>
                </select>
                <div style="border-left: 1px solid #e2e8f0; margin: 0 0.5rem; height: 30px;"></div>
                <button class="btn-primary" style="background:#f59e0b;" onclick="window.editSelected()">✏️ 선택
                    수정</button>
                <button class="btn-primary" style="background:#ef4444;" onclick="window.deleteSelected()">🗑️ 선택
                    삭제</button>
                <button class="btn-primary" style="background:var(--success, #10B981);"
                    onclick="window.requestSelectedPurchase()">🛒 선택 구매요청</button>
                <button class="btn-primary" onclick="window.goToRegisterMaterial()">+ 자재 등록</button>
            </div>
        </div>

        <div class="card" style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead id="materialsHead">
                    <tr style="border-bottom: 2px solid var(--border-color);">
                        <th style="padding: 1rem; width: 40px;"><input type="checkbox" id="selectAllMaterials"
                                onclick="window.toggleAllMaterials(this.checked)"></th>
                        <th style="padding: 1rem; width: 60px;">사진</th>
                        <th style="padding: 1rem;">자재코드</th>
                        <th style="padding: 1rem;">자재명</th>
                        <th style="padding: 1rem;">규격</th>
                        <th style="padding: 1rem;">카테고리</th>
                        <th style="padding: 1rem;">단가 (VND)</th>
                        <th style="padding: 1rem;">재고/확보량</th>
                        <th style="padding: 1rem;">총 자산가치</th>
                    </tr>
                </thead>
                <tbody id="materialsTableBody">
                    <tr>
                        <td colspan="7" style="padding: 1rem; text-align: center;">로딩 중...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module">
        import { getAllMaterials, getSupplierPrices } from '../services/materialApi.js';
        import { db } from '../assets/js/firebase-config.js';
        import { doc, updateDoc, deleteDoc, addDoc, collection, serverTimestamp, getDocs, query, orderBy } from 'firebase/firestore';

        let allAdminMaterials = [];
        let currentTab = 'all';
        const tbody = document.getElementById('materialsTableBody');
        const filterEl = document.getElementById('adminCatFilter');
        const searchEl = document.getElementById('adminSearchFilter');

        window.switchTab = (tab) => {
            currentTab = tab;
            const tabAll = document.getElementById('tab-all');
            const tabSecured = document.getElementById('tab-secured');
            const tabLogs = document.getElementById('tab-logs');
            const viewTitle = document.getElementById('viewTitle');
            const head = document.getElementById('materialsHead');

            [tabAll, tabSecured, tabLogs].forEach(t => {
                t.style.color = 'var(--text-secondary)';
                t.style.borderBottom = 'none';
            });

            if (tab === 'all') {
                tabAll.style.color = 'var(--primary-color, #4F46E5)';
                tabAll.style.borderBottom = '2px solid var(--primary-color, #4F46E5)';
                viewTitle.textContent = '전체 자재 목록';
            } else if (tab === 'secured') {
                tabSecured.style.color = 'var(--primary-color, #4F46E5)';
                tabSecured.style.borderBottom = '2px solid var(--primary-color, #4F46E5)';
                viewTitle.textContent = '확보 자산 및 재고 목록';
            } else {
                tabLogs.style.color = 'var(--primary-color, #4F46E5)';
                tabLogs.style.borderBottom = '2px solid var(--primary-color, #4F46E5)';
                viewTitle.textContent = '자재 소모(반출) 전체 내역 (CEO 열람)';
            }

            if (tab === 'logs') {
                head.innerHTML = `
                    <tr style="border-bottom: 2px solid var(--border-color);">
                        <th style="padding: 1rem;">소모/반출 일시</th>
                        <th style="padding: 1rem;">자재코드</th>
                        <th style="padding: 1rem;">자재명</th>
                        <th style="padding: 1rem;">사용처/프로젝트</th>
                        <th style="padding: 1rem;">소모 수량</th>
                        <th style="padding: 1rem;">담당자 (작성자)</th>
                    </tr>
                `;
                document.getElementById('adminCatFilter').style.display = 'none';
            } else {
                head.innerHTML = `
                    <tr style="border-bottom: 2px solid var(--border-color);">
                        <th style="padding: 1rem; width: 40px;"><input type="checkbox" id="selectAllMaterials"
                                onclick="window.toggleAllMaterials(this.checked)"></th>
                        <th style="padding: 1rem; width: 60px;">사진</th>
                        <th style="padding: 1rem;">자재코드</th>
                        <th style="padding: 1rem;">자재명</th>
                        <th style="padding: 1rem;">규격</th>
                        <th style="padding: 1rem;">카테고리</th>
                        <th style="padding: 1rem;">단가 (VND)</th>
                        <th style="padding: 1rem;">재고/확보량</th>
                        <th style="padding: 1rem;">총 자산가치</th>
                    </tr>
                `;
                document.getElementById('adminCatFilter').style.display = 'inline-block';
            }
            applyFilters();
        };

        window.toggleAllMaterials = (checked) => {
            const checkboxes = document.querySelectorAll('.material-checkbox');
            checkboxes.forEach(c => c.checked = checked);
        };

        window.requestSelectedPurchase = async () => {
            if (window.currentUserRole !== 'SUPER_ADMIN' && window.currentUserRole !== 'PM' && (window.currentUserPosition || '').indexOf('팀장') === -1) {
                alert("접근 불가: 프로젝트 관리자(PM) 또는 결재 권한이 있는 팀장급 이상만 자재 구매 요청을 진행할 수 있습니다.");
                return;
            }

            const checkboxes = document.querySelectorAll('.material-checkbox:checked');
            if (checkboxes.length === 0) {
                alert("구매 요청할 자재를 선택해주세요.");
                return;
            }

            const selectedItemsDesc = Array.from(checkboxes).map(c => c.getAttribute('data-name')).join('\\n- ');
            if (confirm(`다음 자재들에 대해 구매 요청(결재)을 진행하시겠습니까?\n\n[선택항목]\n- ${selectedItemsDesc}`)) {
                try {
                    let totalVal = 0;
                    const itemsToPurchase = Array.from(checkboxes).map(c => {
                        const name = c.getAttribute('data-name');
                        const price = parseInt(c.getAttribute('data-price')) || 0;
                        const qty = 1; // Default request is 1, user can edit downstream if implemented
                        totalVal += (price * qty);
                        return { id: c.value, name, price, quantity: qty };
                    });

                    await addDoc(collection(db, 'purchaseRequests'), {
                        department: window.currentUserPosition || 'PM',
                        requesterName: window.currentUserEmail || 'Unknown',
                        notes: '자재 리스트에서 선택구매 상신됨',
                        totalAmount: totalVal,
                        items: itemsToPurchase,
                        status: 'PENDING_TEAM_LEAD',
                        createdAt: serverTimestamp(),
                        updatedAt: serverTimestamp()
                    });

                    alert("구매결재가 성공적으로 상신되었습니다! 결재관리(구매) 메뉴에서 확인 가능합니다.");
                    Array.from(checkboxes).forEach(c => c.checked = false);
                    const selectAll = document.getElementById('selectAllMaterials');
                    if (selectAll) selectAll.checked = false;
                } catch (e) {
                    console.error(e);
                    alert("상신 중 오류가 발생했습니다: " + e.message);
                }
            }
        };

        window.goToRegisterMaterial = () => {
            if (window.currentUserRole !== 'SUPER_ADMIN' && window.currentUserRole !== 'PM' && (window.currentUserPosition || '').indexOf('팀장') === -1) {
                alert("접근 불가: 프로젝트 관리자(PM/팀장) 또는 최고 관리자만 신규 자재 품목을 등록 및 리스트업할 수 있습니다.");
                return;
            }
            location.href = 'material-form.html';
        };

        window.editSelected = () => {
            if (window.currentUserRole !== 'SUPER_ADMIN' && window.currentUserRole !== 'PM' && (window.currentUserPosition || '').indexOf('팀장') === -1) {
                alert("접근 불가: 권한이 없습니다."); return;
            }
            const checkboxes = document.querySelectorAll('.material-checkbox:checked');
            if (checkboxes.length === 0) { alert("수정할 자재를 선택해주세요."); return; }
            if (checkboxes.length > 1) { alert("수정은 한 번에 한 항목씩만 가능합니다."); return; }
            location.href = `material-form.html?id=${checkboxes[0].value}`;
        };

        window.deleteSelected = async () => {
            if (window.currentUserRole !== 'SUPER_ADMIN' && window.currentUserRole !== 'PM' && (window.currentUserPosition || '').indexOf('팀장') === -1) {
                alert("접근 불가: 권한이 없습니다."); return;
            }
            const checkboxes = document.querySelectorAll('.material-checkbox:checked');
            if (checkboxes.length === 0) { alert("삭제할 자재를 선택해주세요."); return; }

            const names = Array.from(checkboxes).map(c => c.getAttribute('data-name')).join('\\n- ');
            if (!confirm(`정말로 다음 자재들을 삭제하시겠습니까?\n\n[선택항목]\n- ${names}\n\n(삭제 시 복구가 불가능합니다)`)) {
                return;
            }

            try {
                for (const c of checkboxes) {
                    await deleteDoc(doc(db, 'materials', c.value));
                }
                alert("선택한 자재들이 삭제되었습니다.");
                loadMaterials();
            } catch (e) {
                console.error("Delete Error", e);
                alert("삭제 중 오류가 발생했습니다: " + e.message);
            }
        };

        let currentConsumeId = null;
        window.openConsumeModal = (id, name, stock) => {
            if (window.currentUserRole !== 'SUPER_ADMIN' && window.currentUserRole !== 'PM' && (window.currentUserPosition || '').indexOf('팀장') === -1) {
                alert("접근 불가: PM/팀장 또는 최고 관리자만 자재 소모/반출 처리가 가능합니다.");
                return;
            }
            currentConsumeId = id;
            document.getElementById('consumeItemName').textContent = name;
            document.getElementById('consumeCurrentStock').textContent = stock;
            document.getElementById('consumeQty').value = '';
            document.getElementById('consumeReason').value = '';
            document.getElementById('consumeModal').showModal();
        };

        window.submitConsume = async () => {
            const qty = parseInt(document.getElementById('consumeQty').value);
            const reason = document.getElementById('consumeReason').value.trim();
            const currStock = parseInt(document.getElementById('consumeCurrentStock').textContent);

            if (!qty || qty <= 0) { alert("반출 수량을 정확히 입력하세요."); return; }
            if (qty > currStock) { alert("현재 보유 중인 재고량보다 많이 반출할 수 없습니다!"); return; }
            if (!reason) { alert("사용처(프로젝트)를 반드시 입력해주세요."); return; }

            const btn = document.getElementById('btnConfirmConsume');
            btn.disabled = true;
            btn.textContent = '처리 중...';
            try {
                // Deduct stock
                await updateDoc(doc(db, 'materials', currentConsumeId), {
                    stock: currStock - qty,
                    updatedAt: serverTimestamp()
                });

                // Add to usage logs
                await addDoc(collection(db, 'material_usage_logs'), {
                    materialId: currentConsumeId,
                    materialName: document.getElementById('consumeItemName').textContent,
                    materialCode: allAdminMaterials.find(m => m.id === currentConsumeId)?.materialCode || '-',
                    quantity: qty,
                    reason: reason,
                    userEmail: window.currentUserEmail || 'Unknown',
                    userName: window.currentUserPosition || 'Unknown',
                    createdAt: serverTimestamp()
                });

                alert("성공적으로 자재가 반출/소모 처리되었습니다.");
                document.getElementById('consumeModal').close();
                loadMaterials();
            } catch (err) {
                console.error(err);
                alert("처리 실패: " + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '소모 확정';
            }
        };

        const renderLogs = async () => {
            tbody.innerHTML = `<tr><td colspan="6" style="padding: 1rem; text-align: center;">데이터 호출 중...</td></tr>`;
            try {
                const q = query(collection(db, 'material_usage_logs'), orderBy('createdAt', 'desc'));
                const snap = await getDocs(q);
                if (snap.empty) {
                    tbody.innerHTML = `<tr><td colspan="6" style="padding: 1rem; text-align: center;">소모/반출 내역이 없습니다.</td></tr>`;
                    return;
                }
                tbody.innerHTML = '';
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    const dt = data.createdAt ? data.createdAt.toDate().toLocaleString() : '방금 전';
                    const tr = document.createElement('tr');
                    tr.style.borderBottom = '1px solid var(--border-color)';
                    tr.innerHTML = `
                        <td style="padding: 1rem;">${dt}</td>
                        <td style="padding: 1rem;">${data.materialCode || '-'}</td>
                        <td style="padding: 1rem; font-weight:bold; color:var(--primary-color)">${data.materialName}</td>
                        <td style="padding: 1rem;">${data.reason}</td>
                        <td style="padding: 1rem; color:#ef4444; font-weight:bold;">-${data.quantity} 개</td>
                        <td style="padding: 1rem;">${data.userName} (${data.userEmail})</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error(e);
                tbody.innerHTML = `<tr><td colspan="6" style="padding: 1rem; text-align: center; color: red;">에러 발생</td></tr>`;
            }
        };

        const renderTable = async (materials) => {
            if (materials.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="padding: 1rem; text-align: center;">등록된 자재가 없습니다.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            // Fetch suppliers concurrently for performance
            const supplierPromises = materials.map(m => getSupplierPrices(m.id));
            const suppliersData = await Promise.all(supplierPromises);

            materials.forEach((m, index) => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid var(--border-color)';
                tr.style.cursor = 'pointer';
                tr.onclick = () => location.href = `material-form.html?id=${m.id}`; // Edit page logic placeholder

                const imgUrl = (m.images && m.images.length > 0) ? m.images[0] : 'https://placehold.co//e2e8f0/475569?text=No+Image';

                // Actual inventory value from DB
                const stock = m.stock || 0;
                const price = m.ourPurchasePrice || 0;
                const assetValue = stock * price;

                tr.innerHTML = `
                    <td style="padding: 1rem;" onclick="event.stopPropagation()"><input type="checkbox" class="material-checkbox" value="${m.id}" data-name="${m.name}" data-price="${price}"></td>
                    <td style="padding: 1rem;"><img src="${imgUrl}" style="width:50px; height:50px; object-fit:cover; border-radius:4px;" alt="thumb"></td>
                    <td style="padding: 1rem;">${m.materialCode || '-'}</td>
                    <td style="padding: 1rem; font-weight: 500;">${m.name}</td>
                    <td style="padding: 1rem;">${m.specification || '-'}</td>
                    <td style="padding: 1rem;">
                        <span style="background: #e2e8f0; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem;">
                            ${m.categoryId || '-'}
                        </span>
                    </td>
                    <td style="padding: 1rem;">${price.toLocaleString()}</td>
                    <td style="padding: 1rem; font-weight: 700; color: ${stock > 0 ? 'var(--primary-color, #4F46E5)' : '#94a3b8'};">
                        <div style="display:flex; align-items:center; gap:0.5rem;">
                            <span>${stock} 개</span>
                            ${stock > 0 ? `<button onclick="window.openConsumeModal('${m.id}', '${m.name}', ${stock}); event.stopPropagation();" style="padding:0.2rem 0.5rem; background:#f59e0b; color:white; border:none; border-radius:4px; font-size:0.75rem; cursor:pointer;" class="hover-btn">반출</button>` : ''}
                        </div>
                    </td>
                    <td style="padding: 1rem; font-weight: 800; color: #10B981;">
                        ${assetValue > 0 ? assetValue.toLocaleString() : '-'}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        };

        const applyFilters = async () => {
            if (currentTab === 'logs') {
                await renderLogs();
                return;
            }

            let filtered = allAdminMaterials;

            // Tab filtering (보유 자산 탭)
            if (currentTab === 'secured') {
                filtered = filtered.filter(m => (m.stock || 0) > 0);
            }

            // Search filtering
            const term = searchEl.value.toLowerCase().trim();
            if (term) {
                filtered = filtered.filter(m =>
                    (m.name || '').toLowerCase().includes(term) ||
                    (m.materialCode || '').toLowerCase().includes(term)
                );
            }

            // Category filtering
            const cat = filterEl.value;
            if (cat) {
                filtered = filtered.filter(m => m.categoryId === cat);
            }

            await renderTable(filtered);
        };

        const loadMaterials = async () => {
            try {
                tbody.innerHTML = `<tr><td colspan="9" style="padding: 1rem; text-align: center;">데이터 호출 중...</td></tr>`;
                allAdminMaterials = await getAllMaterials();
                allAdminMaterials.sort((a, b) => (a.materialCode || '').localeCompare(b.materialCode || ''));
                await applyFilters();
            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="9" style="padding: 1rem; text-align: center; color: red;">오류 발생: ${err.message}</td></tr>`;
            }
        };

        filterEl.addEventListener('change', () => {
            applyFilters();
        });

        searchEl.addEventListener('input', () => {
            applyFilters();
        });

        loadMaterials();
    </script>

    <!-- Global Auth Guard -->
    <script type="module">
        import { checkAdminAuth } from '../assets/js/auth.js';
        import { db } from '../assets/js/firebase-config.js';
        import { collection, query, where, getDocs } from 'firebase/firestore';

        window.currentUserRole = 'GUEST';
        window.currentUserPosition = '일반 직원';

        checkAdminAuth(
            async (user) => {
                document.body.style.display = 'block';

                const emailSpan = document.getElementById('navUserEmailSpan');
                if (emailSpan) {
                    emailSpan.textContent = user.email;
                }

                try {
                    const q = query(collection(db, 'users'), where('email', '==', user.email));
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        const data = snap.docs[0].data();
                        window.currentUserRole = data.role || 'GUEST';
                        window.currentUserPosition = data.position || '직원';
                        window.currentUserEmail = user.email;
                    } else if (user.email === 'daguri75@gmail.com') {
                        window.currentUserRole = 'SUPER_ADMIN';
                        window.currentUserPosition = '최고 관리자';
                        window.currentUserEmail = user.email;
                    }
                } catch (e) {
                    console.error('Failed to fetch user permissions:', e);
                }
            },
            () => {
                const current = window.location.pathname + window.location.search;
                window.location.href = '../login.html?redirect=' + encodeURIComponent(current);
            }
        );

        import { logoutAdmin } from '../assets/js/auth.js';
        window.logoutAndRedirect = () => {
            logoutAdmin();
            window.location.href = '../login.html';
        };
    </script>
</body>
