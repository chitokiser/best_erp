                    </td>
                    <td style="padding: 1rem; font-weight: 800; color: #10B981;">
                        ${assetValue > 0 ? assetValue.toLocaleString() : '-'}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        };

        const applyFilters = async () => {
            if (currentTab === 'logs') {
                await renderLogs();
                return;
            }

            let filtered = allAdminMaterials;

            // Tab filtering (蹂댁쑀 ?먯궛 ??
            if (currentTab === 'secured') {
                filtered = filtered.filter(m => (m.stock || 0) > 0);
            }

            // Search filtering
            const term = searchEl.value.toLowerCase().trim();
            if (term) {
                filtered = filtered.filter(m =>
                    (m.name || '').toLowerCase().includes(term) ||
                    (m.materialCode || '').toLowerCase().includes(term)
                );
            }

            // Category filtering
            const cat = filterEl.value;
            if (cat) {
                filtered = filtered.filter(m => m.categoryId === cat);
            }

            await renderTable(filtered);
        };

        const loadMaterials = async () => {
            try {
                tbody.innerHTML = `<tr><td colspan="9" style="padding: 1rem; text-align: center;">?곗씠???몄텧 以?..</td></tr>`;
                allAdminMaterials = await getAllMaterials();
                allAdminMaterials.sort((a, b) => (a.materialCode || '').localeCompare(b.materialCode || ''));
                await applyFilters();
            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="9" style="padding: 1rem; text-align: center; color: red;">?ㅻ쪟 諛쒖깮: ${err.message}</td></tr>`;
            }
        };

        filterEl.addEventListener('change', () => {
            applyFilters();
        });

        searchEl.addEventListener('input', () => {
            applyFilters();
        });

        loadMaterials();
    </script>

    <!-- Global Auth Guard -->
    <script type="module">
        import { checkAdminAuth } from '../assets/js/auth.js';
        import { db } from '../assets/js/firebase-config.js';
        import { collection, query, where, getDocs } from 'firebase/firestore';

        window.currentUserRole = 'GUEST';
        window.currentUserPosition = '?쇰컲 吏곸썝';

        checkAdminAuth(
            async (user) => {
                document.body.style.display = 'block';

                const emailSpan = document.getElementById('navUserEmailSpan');
                if (emailSpan) {
                    emailSpan.textContent = user.email;
                }

                try {
                    const q = query(collection(db, 'users'), where('email', '==', user.email));
                    const snap = await getDocs(q);
                    if (!snap.empty) {
                        const data = snap.docs[0].data();
                        window.currentUserRole = data.role || 'GUEST';
                        window.currentUserPosition = data.position || '吏곸썝';
                        window.currentUserEmail = user.email;
                    } else if (user.email === 'daguri75@gmail.com') {
                        window.currentUserRole = 'SUPER_ADMIN';
                        window.currentUserPosition = '理쒓퀬 愿由ъ옄';
                        window.currentUserEmail = user.email;
                    }
                } catch (e) {
                    console.error('Failed to fetch user permissions:', e);
                }
            },
            () => {
                const current = window.location.pathname + window.location.search;
                window.location.href = '../login.html?redirect=' + encodeURIComponent(current);
            }
        );

        import { logoutAdmin } from '../assets/js/auth.js';
        window.logoutAndRedirect = () => {
            logoutAdmin();
            window.location.href = '../login.html';
        };
    </script>
