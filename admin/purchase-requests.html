<head>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .badge {
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .bg-yellow {
            background: #fef08a;
            color: #854d0e;
        }

        .bg-orange {
            background: #fed7aa;
            color: #c2410c;
        }

        .bg-green {
            background: #bbf7d0;
            color: #166534;
        }

        .bg-blue {
            background: #bfdbfe;
            color: #1e3a8a;
        }

        .request-card {
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .item-list {
            font-size: 0.875rem;
            color: #475569;
            margin: 0.5rem 0;
            padding-left: 1.5rem;
        }

        .top-nav {
            background: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .top-nav h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--primary-color, #4F46E5);
            font-weight: 800;
        }

        .top-nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
            margin: 0;
            padding: 0;
        }

        .top-nav a {
            text-decoration: none;
            color: var(--text-secondary, #64748B);
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .top-nav a:hover,
        .top-nav a.active {
            color: var(--primary-color, #4F46E5);
        }
    
        .dropdown { position: relative; display: inline-block; margin-top:2px; }
        .dropdown-content { display: none; position: absolute; background-color: white; min-width: 180px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-radius: 0.5rem; border: 1px solid #e2e8f0; z-index: 1000; overflow: hidden; top:100%; left:0; }
        .dropdown-content a { color: #334155 !important; padding: 0.8rem 1rem !important; text-decoration: none; display: block; font-size: 0.95rem; font-weight: 500; border-bottom: 1px solid #f1f5f9; transition: all 0.2s; white-space: nowrap; }
        .dropdown-content a:last-child { border-bottom: none; }
        .dropdown-content a:hover { background-color: #f8fafc; color: #4F46E5 !important; padding-left: 1.25rem !important; }
        .dropdown:hover .dropdown-content { display: block; animation: fadeInUp 0.2s ease-out; }
        .dropbtn { padding: 0.5rem 0.75rem; color: #475569; font-weight: 600; cursor: pointer; border-radius: 0.5rem; transition: background 0.2s; display:inline-block; }
        .dropdown:hover .dropbtn { color: #4F46E5; background: rgba(79, 70, 229, 0.05); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>

    <!-- FORCE CSS -->
    <style>
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: nowrap;
            overflow: visible;
            position: relative;
        }

        .logo-container {
            width: auto !important;
        }

        .top-nav ul {
            display: flex;
            align-items: center;
            gap: 1rem;
            list-style: none;
            margin: 0;
            padding: 0;
            flex-wrap: nowrap !important;
        }

        .top-nav ul li a {
            white-space: nowrap !important;
        }

        .mobile-only-btn {
            display: none !important;
        }

        @media screen and (max-width: 900px) {
            .mobile-only-btn {
                display: block !important;
            }

            .logo-container {
                width: 100% !important;
                justify-content: space-between !important;
            }

            .top-nav {
                flex-direction: column !important;
                align-items: flex-start !important;
            }

            .top-nav ul {
                display: none !important;
            }

            .top-nav>div:last-child {
                display: none !important;
            }

            .top-nav.menu-open ul {
                display: flex !important;
                flex-direction: column !important;
                width: 100%;
                border-radius: 0.5rem;
                background: #fff;
                box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
                padding: 0.5rem 0 !important;
                gap: 0 !important;
                margin-top: 1rem;
                max-height: 70vh;
                /* Prevent it from going offscreen */
                overflow-y: auto;
                /* Scrollable if too many items */
            }

            .top-nav.menu-open ul li {
                width: 100%;
                border-bottom: 1px solid #f1f5f9;
                text-align: center;
            }

            .top-nav.menu-open ul li a {
                display: block !important;
                padding: 1rem !important;
            }

            .metric-cards,
            .dashboard-grid,
            .client-summary,
            .finance-summary,
            .stats-grid,
            .summary-container {
                grid-template-columns: 1fr !important;
                gap: 1rem !important;
                display: grid !important;
            }
        }
    </style>
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>


<body style="display: none; background: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; padding: 0;">
        <nav class="top-nav">
        <div class="nav-header-bar">
            <div class="nav-brand">

        <ul id="navMenuList">

                <span class="dropbtn">매장 관리(F&B) ▾</span>

            </li>
            <li class="dropdown" onclick="toggleDropdown(this, event)">
                <span class="dropbtn">영업/프로젝트 ▾</span>
                <div class="dropdown-content">
                    <a href="projects.html">프로젝트 보드</a>

    <main class="container" style="padding: 2rem 1rem;">
        <h2 style="margin-bottom: 2rem;">구매 결재 상신함</h2>

        <div class="card">
            <div id="requestsContainer">로딩 중...</div>
        </div>
    </main>

    <script type="module">
        import { getPurchaseRequests, updateRequestStatus, deletePurchaseRequest } from '../services/purchaseApi.js';

        const container = document.getElementById('requestsContainer');

        const loadRequests = async () => {
            try {
                window.currentRequests = await getPurchaseRequests();
                const requests = window.currentRequests;

                if (requests.length === 0) {
                    container.innerHTML = '<p>현재 대기 중이거나 처리된 결재건이 없습니다.</p>';
                    return;
                }

                let html = '';
                requests.forEach(r => {
                    let badgeClass = 'bg-yellow';
                    let statusKor = '팀장 승인 대기';

                    if (r.status === 'PENDING_CEO') { badgeClass = 'bg-orange'; statusKor = 'CEO 승인 대기'; }
                    if (r.status === 'APPROVED') { badgeClass = 'bg-green'; statusKor = '승인 완료 (구매 대기)'; }
                    if (r.status === 'PURCHASED') { badgeClass = 'bg-blue'; statusKor = '구매/발주 완료'; }

                    const dateStr = r.createdAt ? new Date(r.createdAt.seconds * 1000).toLocaleString() : '방금 전';

                    // Render items
                    let itemsHtml = '<ul class="item-list">';
                    r.items.forEach(itm => {
                        itemsHtml += `<li>${itm.name} (수량: ${itm.quantity}) - ${(itm.price * itm.quantity).toLocaleString()} VND</li>`;
                    });
                    itemsHtml += '</ul>';

                    const isRequester = r.requesterName.includes(window.currentUserEmail || 'UNLOADED_EMAIL');
                    let controlBtns = '';

                    if (isRequester || (window.currentUserEmail === 'daguri75@gmail.com')) {
                        // Editable if not yet fully purchased
                        if (r.status !== 'PURCHASED') {
                            controlBtns += `<button class="btn-primary" style="background:#475569;" onclick="window.handleEdit('${r.id}')">수정(장바구니 이동)</button>`;
                        }
                        controlBtns += `<button class="btn-primary" style="background:#ef4444;" onclick="window.handleDelete('${r.id}')">삭제</button>`;
                    }

                    const role = window.currentUserRole || 'GUEST';
                    const canApproveTeam = role === 'SUPER_ADMIN' || role === 'PM';
                    const canApproveCEO = role === 'SUPER_ADMIN';

                    let approveBtns = '';
                    if (r.status === 'PENDING_TEAM_LEAD' && canApproveTeam) {
                        approveBtns = `<button class="btn-primary" onclick="window.handleApprove('${r.id}', 'PENDING_CEO')">팀장 승인</button>`;
                    } else if (r.status === 'PENDING_CEO' && canApproveCEO) {
                        approveBtns = `<button class="btn-primary" style="background:#059669;" onclick="window.handleApprove('${r.id}', 'APPROVED')">CEO 최종 승인</button>`;
                    } else if (r.status === 'APPROVED' && canApproveTeam) {
                        approveBtns = `<button class="btn-primary" style="background:#2563eb;" onclick="window.handleApprove('${r.id}', 'PURCHASED')">발주 처리</button>`;
                    }

                    html += `
                        <div class="request-card">
                            <div style="display:flex; justify-content: space-between; align-items: start; margin-bottom: 1rem;">
                                <div>
                                    <span class="badge ${badgeClass}">${statusKor}</span>
                                    <h3 style="margin: 0.5rem 0;">${r.department} - ${r.requesterName}</h3>
                                    <p style="font-size: 0.875rem; color: #64748b;">상신일: ${dateStr}</p>
                                </div>
                                <div style="text-align: right;">
                                    <div style="font-size: 1.25rem; font-weight: bold; color: var(--primary-color);">
                                        총 ${r.totalAmount ? r.totalAmount.toLocaleString() : '0'} VND
                                    </div>
                                    <div style="margin-top: 0.5rem; display:flex; gap:0.5rem; justify-content:flex-end;">
                                        ${controlBtns}
                                    </div>
                                </div>
                            </div>
                            
                            <div style="background: #f8fafc; padding: 1rem; border-radius: 8px;">
                                <strong>요청 사유:</strong>
                                <p style="font-size: 0.875rem; margin-top: 0.25rem; margin-bottom: 1rem;">${r.notes || '없음'}</p>
                                <strong>요청 자재 품목:</strong>
                                ${itemsHtml}
                            </div>
                            
                            <div style="margin-top: 1rem; display: flex; gap: 0.5rem; justify-content: flex-end;">
                                ${approveBtns}
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="color:red;">결재 목록을 불러오는 중 오류가 발생했습니다.</p>';
            }
        };

        window.renderRequests = loadRequests; // Expose globally for re-rendering after auth

        window.handleApprove = async (id, nextStatus) => {
            if (!confirm('이 결재건을 승인/진행 하시겠습니까?')) return;
            try {
                await updateRequestStatus(id, nextStatus, 'Admin User');
                loadRequests(); // refresh
            } catch (e) {
                alert('처리 중 오류가 발생했습니다: ' + e.message);
            }
        };

        window.handleDelete = async (id) => {
            if (!confirm('정말로 이 기안/결재 요청을 완전히 삭제하시겠습니까? (이 작업은 되돌릴 수 없습니다)')) return;
            try {
                await deletePurchaseRequest(id);
                alert('삭제되었습니다.');
                loadRequests();
            } catch (e) {
                alert('삭제 중 오류: ' + e.message);
            }
        };

        window.handleEdit = async (id) => {
            const r = (window.currentRequests || []).find(x => x.id === id);
            if (!r) return;

            if (!confirm('현재 장바구니에 담긴 내역이 있다면 초기화되고, 이 요청의 품목들로 장바구니가 덮어씌워집니다.\n기존 결재건은 즉시 "삭제" 처리됩니다. 계속하시겠습니까?')) return;

            try {
                localStorage.setItem('best_cart', JSON.stringify(r.items));
                await deletePurchaseRequest(id);
                alert('결재 요청이 회수되었습니다. 자재 장바구니 화면으로 이동하여 수정 후 다시 상신해주세요.');
                window.location.href = '../request-form.html';
            } catch (e) {
                alert('수정 처리 중 에러: ' + e.message);
            }
        };

        loadRequests();
    </script>

    <!-- Global Auth Guard -->
    <script type="module">
        import { checkAdminAuth } from '../assets/js/auth.js';

        checkAdminAuth(
            (user) => {
                document.body.style.display = 'block';
                window.currentUserEmail = user.email;

                // Update display email in our new top-nav
                const emailSpan = document.getElementById('navUserEmailSpan');
                if (emailSpan) {
                    emailSpan.textContent = user.email;
                }

                if (window.renderRequests) window.renderRequests();
            },
            () => {
                const current = window.location.pathname + window.location.search;
                window.location.href = '../login.html?redirect=' + encodeURIComponent(current);
            }
        );

        import { logoutAdmin } from '../assets/js/auth.js';
        window.logoutAndRedirect = () => {
            logoutAdmin();
            window.location.href = '../login.html';
        };
    </script>
<script>
            function highlightActiveMenu() {
                const current = location.pathname.split('/').pop() || 'dashboard.html';
                document.querySelectorAll('.top-nav a').forEach(a => {
                    const href = a.getAttribute('href');
                    if (href && href === current) {
                        a.style.color = 'var(--primary-color, #4F46E5)';
                        a.style.fontWeight = '700';
                        const parentDropBtn = a.closest('.dropdown');
                        if (parentDropBtn) {
                            parentDropBtn.querySelector('.dropbtn').style.color = 'var(--primary-color, #4F46E5)';
                            parentDropBtn.querySelector('.dropbtn').style.background = 'rgba(79, 70, 229, 0.05)';
                        }
                    } else if (a.classList.contains('active') && href !== current) {
                        a.classList.remove('active');
                    }
                });
            }
            document.addEventListener('DOMContentLoaded', highlightActiveMenu);
        </script></body>

</html>
