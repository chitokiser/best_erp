<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CEO MANAGER - 현장 (Sites)</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --ai-primary: #4F46E5; --ai-secondary: #818CF8; --ai-gradient: linear-gradient(135deg, #4F46E5, #7C3AED); --text-dark: #1E293B; --text-muted: #64748B; }
        body { background: #f8fafc; font-family: 'Inter', sans-serif; margin: 0; padding: 0; color: var(--text-dark); }
        .top-nav { background: white; padding: 1rem 2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; justify-content: space-between; align-items: center; }
        .top-nav .logo { font-size: 1.5rem; font-weight: 800; background: var(--ai-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; cursor: pointer;}
        .main-container { max-width: 1200px; margin: 3rem auto; padding: 0 1.5rem; text-align:center; }
    
        .dropdown { position: relative; display: inline-block; margin-top:2px; }
        .dropdown-content { display: none; position: absolute; background-color: white; min-width: 180px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-radius: 0.5rem; border: 1px solid #e2e8f0; z-index: 1000; overflow: hidden; top:100%; left:0; }
        .dropdown-content a { color: #334155 !important; padding: 0.8rem 1rem !important; text-decoration: none; display: block; font-size: 0.95rem; font-weight: 500; border-bottom: 1px solid #f1f5f9; transition: all 0.2s; white-space: nowrap; }
        .dropdown-content a:last-child { border-bottom: none; }
        .dropdown-content a:hover { background-color: #f8fafc; color: #4F46E5 !important; padding-left: 1.25rem !important; }
        .dropdown:hover .dropdown-content { display: block; animation: fadeInUp 0.2s ease-out; }
        .dropbtn { padding: 0.5rem 0.75rem; color: #475569; font-weight: 600; cursor: pointer; border-radius: 0.5rem; transition: background 0.2s; display:inline-block; }
        .dropdown:hover .dropbtn { color: #4F46E5; background: rgba(79, 70, 229, 0.05); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    </style>

    <!-- FORCE CSS -->
<style>
    .top-nav { display: flex; align-items: center; justify-content: space-between; flex-wrap: nowrap; overflow: visible; position: relative; }
    .logo-container { width: auto !important; }
    .top-nav ul { display: flex; align-items: center; gap: 1rem; list-style: none; margin: 0; padding: 0; flex-wrap: nowrap !important; }
    .top-nav ul li a { white-space: nowrap !important; }
    .mobile-only-btn { display: none !important; }
    
    @media screen and (max-width: 900px) {
        .mobile-only-btn { display: block !important; }
        .logo-container { width: 100% !important; justify-content: space-between !important; }
        .top-nav { flex-direction: column !important; align-items: flex-start !important; }
        .top-nav ul { display: none !important; }
        .top-nav > div:last-child { display: none !important; }
        
        .top-nav.menu-open ul { 
            display: flex !important; flex-direction: column !important; 
            width: 100%; border-radius: 0.5rem; background:#fff; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); padding: 0.5rem 0 !important; gap: 0 !important;
            margin-top: 1rem;
            max-height: 70vh; /* Prevent it from going offscreen */
            overflow-y: auto; /* Scrollable if too many items */
        }
        .top-nav.menu-open ul li { width: 100%; border-bottom: 1px solid #f1f5f9; text-align:center; }
        .top-nav.menu-open ul li a { display: block !important; padding: 1rem !important; }
        
        .metric-cards, .dashboard-grid, .client-summary, .finance-summary, .stats-grid, .summary-container { 
            grid-template-columns: 1fr !important; gap: 1rem !important; display: grid !important;
        }
    }
</style>
    </head>
    
<body>
    <nav class="top-nav">
        <div class="logo-container" style="display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:0;">
    <div style="display:flex; align-items:center; gap:0.5rem; flex-shrink:0; cursor:pointer;" onclick="location.href='dashboard.html'">
        <img src="../images/logo/logo.png" style="height: 28px;" onerror="this.style.display='none';">
        <h1 style="margin:0; font-size: 1.3rem; color: #4F46E5; font-weight: 800; white-space:nowrap;">AI경영관리</h1>
    </div>
    <div class="mobile-only-btn" style="display:none; cursor:pointer;" onclick="document.querySelector('.top-nav').classList.toggle('menu-open')">
        <svg viewBox="0 0 24 24" width="28" height="28" stroke="#4F46E5" stroke-width="2" fill="none"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </div>
</div>
        <ul class="nav-links" style="display:flex; gap:1.5rem; list-style:none; margin:0; padding:0; font-weight:600; font-size:0.95rem;">
            <li><a href="employees.html" style="text-decoration:none; color:#64748B;">직원</a></li>
            <li><a href="users.html">회원관리</a></li>
            <li><a href="clients.html" style="text-decoration:none; color:#64748B;">고객</a></li>
            <li><a href="tasks.html">업무지시/보고</a></li>

            <li><a href="projects.html" style="text-decoration:none; color:#64748B;">프로젝트</a></li>
            
            <li><a href="suppliers.html" style="text-decoration:none; color:#64748B;">협력사</a></li>
            <li><a href="contacts.html" style="text-decoration:none; color:#64748B;">인맥</a></li>
            <li><a href="finance.html" style="text-decoration:none; color:#64748B;">재무</a></li>
            <li><a href="materials.html" style="text-decoration:none; color:#64748B;">자재</a></li>
        </ul>
        <a href="dashboard.html" style="text-decoration:none; color: #4F46E5; font-size: 0.9rem; font-weight:700;">메인으로</a>
    </nav>
    <div class="main-container">
        <h2>현장 (Sites) 데이터베이스</h2>
        <p style="color:var(--text-muted); margin-top:1rem;">해당 DB 화면은 현재 상세 기획 및 개발(MVP) 대기 중입니다.<br>추후 AI 지식그래프 연동이 완료되면 실제 경영 데이터가 이곳에 표시될 예정입니다.</p>
        <div style="margin-top:3rem; padding: 3rem; background:white; border-radius:1.5rem; border:1px dashed #cbd5e1;">UI 개발 진행 예정 영역</div>
    </div>
<script>
            function highlightActiveMenu() {
                const current = location.pathname.split('/').pop() || 'dashboard.html';
                document.querySelectorAll('.top-nav a').forEach(a => {
                    const href = a.getAttribute('href');
                    if (href && href === current) {
                        a.style.color = 'var(--primary-color, #4F46E5)';
                        a.style.fontWeight = '700';
                        const parentDropBtn = a.closest('.dropdown');
                        if (parentDropBtn) {
                            parentDropBtn.querySelector('.dropbtn').style.color = 'var(--primary-color, #4F46E5)';
                            parentDropBtn.querySelector('.dropbtn').style.background = 'rgba(79, 70, 229, 0.05)';
                        }
                    } else if (a.classList.contains('active') && href !== current) {
                        a.classList.remove('active');
                    }
                });
            }
            document.addEventListener('DOMContentLoaded', highlightActiveMenu);
        </script></body>
</html>
