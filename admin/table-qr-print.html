<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🖨️ 테이블별 주문 QR 코드 일괄 생성기 | BestERP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    .qr-wrap { max-width: 1120px; margin: 20px auto; padding: 0 16px 48px; }
    .qr-ctrl { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 18px; margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    .qr-ctrl label { display: block; font-size: 0.78rem; font-weight: 800; color: #475569; margin-bottom: 4px; }
    .qr-ctrl input { padding: 9px 12px; border-radius: 10px; border: 1px solid #cbd5e1; width: 110px; font-weight: 800; }
    .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
    .qr-card { background: #fff; border: 2px solid #1e1b4b; border-radius: 18px; padding: 18px; text-align: center; page-break-inside: avoid; }
    .qr-store { font-size: 0.84rem; font-weight: 800; color: #4f46e5; margin-bottom: 2px; }
    .qr-tbl { font-size: 1.35rem; font-weight: 900; color: #0f172a; margin-bottom: 10px; }
    .qr-card canvas { display: block; margin: 0 auto 10px; }
    .qr-sub { font-size: 0.78rem; color: #475569; font-weight: 700; line-height: 1.4; }
    .no-print { }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; }
      .qr-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; }
    }
  </style>
</head>
<body class="admin-body">
  <div class="qr-wrap">
    <div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
      <div>
        <a href="dashboard.html" style="font-size:0.84rem;color:#4f46e5;font-weight:700;text-decoration:none;">← 대시보드로 돌아가기</a>
        <h2 style="margin:6px 0 0;font-size:1.4rem;font-weight:900;">🖨️ 테이블별 주문 QR 코드 일괄 생성 · 인쇄</h2>
      </div>
      <div style="display:flex;gap:8px;">
        <a href="kitchen-orders.html" style="padding:8px 14px;border-radius:10px;background:#ea580c;color:#fff;font-weight:800;font-size:0.84rem;text-decoration:none;">🍽️ 주방 알림판(KDS) 열기 →</a>
        <button type="button" onclick="window.print()" style="padding:8px 16px;border-radius:10px;border:none;background:#0f172a;color:#fff;font-weight:800;font-size:0.84rem;cursor:pointer;">🖨️ 전체 인쇄 / PDF 저장</button>
      </div>
    </div>

    <div class="qr-ctrl no-print">
      <div>
        <label for="tblStart">시작 테이블 번호</label>
        <input type="number" id="tblStart" value="1" min="1" max="200" />
      </div>
      <div>
        <label for="tblEnd">끝 테이블 번호</label>
        <input type="number" id="tblEnd" value="12" min="1" max="200" />
      </div>
      <button type="button" id="btnGenTables" style="padding:10px 18px;border-radius:10px;border:none;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:800;cursor:pointer;">✨ 테이블 QR 생성</button>
      <span id="qrStoreInfo" style="font-size:0.84rem;font-weight:700;color:#475569;"></span>
    </div>

    <div id="qrGrid" class="qr-grid"></div>
  </div>

  <script type="module">
    import { checkAdminAuth } from '../assets/js/auth.js';
    import { getCurrentStoreInfo, loadDynamicTenants } from '../assets/js/tenant-router.js';

    let _storeId = '';
    let _storeName = '가맹점';

    function renderGrid() {
      const start = Math.max(1, Number(document.getElementById('tblStart').value || 1));
      const end = Math.min(start + 49, Math.max(start, Number(document.getElementById('tblEnd').value || 12)));
      const grid = document.getElementById('qrGrid');
      grid.innerHTML = '';

      for (let t = start; t <= end; t++) {
        const url = `${window.location.origin}/table-order.html?store=${encodeURIComponent(_storeId)}&table=${t}`;
        const card = document.createElement('div');
        card.className = 'qr-card';
        card.innerHTML = `
          <div class="qr-store">${_storeName}</div>
          <div class="qr-tbl">TABLE ${t}</div>
          <canvas id="qrTblCanvas_${t}"></canvas>
          <div class="qr-sub">카메라로 QR을 스캔해<br/>메뉴를 바로 주문하세요 🍽️</div>
          <div class="no-print" style="margin-top:10px;display:flex;gap:6px;justify-content:center;">
            <a href="${url}" target="_blank" style="font-size:0.74rem;padding:5px 9px;border-radius:8px;background:#eef2ff;color:#4f46e5;font-weight:800;text-decoration:none;">테스트 주문</a>
            <button type="button" data-dl="${t}" style="font-size:0.74rem;padding:5px 9px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;font-weight:800;cursor:pointer;">PNG 저장</button>
          </div>
        `;
        grid.appendChild(card);

        const canvas = document.getElementById(`qrTblCanvas_${t}`);
        if (window.QRCode && canvas) {
          window.QRCode.toCanvas(canvas, url, { width: 170, margin: 1, color: { dark: '#0f172a', light: '#ffffff' } });
        }
        card.querySelector(`[data-dl="${t}"]`)?.addEventListener('click', () => {
          const a = document.createElement('a');
          a.download = `table-${t}-qr-${_storeId}.png`;
          a.href = canvas.toDataURL('image/png');
          a.click();
        });
      }
    }

    document.getElementById('btnGenTables').addEventListener('click', renderGrid);

    checkAdminAuth(async () => {
      await loadDynamicTenants();
      const info = getCurrentStoreInfo();
      if (!info.storeId) { location.href = '../onboarding.html'; return; }
      _storeId = String(info.storeId);
      _storeName = info.name || '가맹점';
      document.getElementById('qrStoreInfo').textContent = `🏪 ${_storeName} (ID: ${_storeId})`;
      renderGrid();
    });
  </script>
</body>
</html>
