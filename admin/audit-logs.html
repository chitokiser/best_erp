<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛡️ 내부통제 · 감사 로그 | BestERP</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
  <style>
    body.admin-body { font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif; background:#f8fafc; color:#0f172a; }
    .wrap { max-width:1100px; margin:20px auto; padding:0 16px 64px; }
    .sub-nav { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:12px 16px; margin-bottom:16px; }
    .sub-nav-links { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .nav-pill { padding:7px 12px; border-radius:9px; font-size:.82rem; font-weight:800; border:1px solid #e2e8f0; background:#f8fafc; color:#334155; text-decoration:none; cursor:pointer; }
    .nav-pill.active { background:#0f172a; color:#fff; border-color:#0f172a; }
    .panel { background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:18px; margin-bottom:16px; }
    .form-row { display:grid; grid-template-columns:1fr 2fr auto; gap:8px; }
    .form-row input, .form-row select { padding:9px 12px; border-radius:10px; border:1px solid #cbd5e1; font-size:.88rem; }
    .btn { padding:9px 14px; border-radius:10px; border:none; background:#4f46e5; color:#fff; font-weight:800; font-size:.84rem; cursor:pointer; }
    .log-row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px; border-bottom:1px solid #f1f5f9; flex-wrap:wrap; font-size:.86rem; }
    .badge { padding:3px 9px; border-radius:999px; font-size:.72rem; font-weight:800; background:#eef2ff; color:#4338ca; }
    @media (max-width:768px) { .form-row { grid-template-columns:1fr; } input, select { font-size:16px; } }
  </style>
</head>
<body class="admin-body">
  <main class="wrap">
    <div class="sub-nav">
      <div class="sub-nav-links">
        <a href="dashboard.html" class="nav-pill">← 대시보드</a>
        <a href="audit-logs.html" class="nav-pill active">🛡️ 내부통제 · 감사 로그</a>
        <a href="finance.html" class="nav-pill">💰 재무/회계</a>
        <a href="approvals.html" class="nav-pill">📝 전자결재</a>
        <a href="saas-settings.html" class="nav-pill">⚙️ SaaS 설정</a>
      </div>
      <span id="storeBadge" style="padding:5px 11px;border-radius:999px;background:#ede9fe;color:#4f46e5;font-size:.78rem;font-weight:800;">가맹점 확인 중...</span>
    </div>

    <div style="margin-bottom:14px;">
      <h2 style="margin:0;font-size:1.38rem;font-weight:900;">🛡️ 내부통제 · 전표 및 권한 변경 감사 로그</h2>
      <p style="margin:4px 0 0;font-size:.85rem;color:#64748b;">재무 전표 수정, 직원 권한(RBAC) 변경, 정산 승인 등 핵심 경영 이벤트를 Firestore에 불변 이력으로 기록·조회합니다.</p>
    </div>

    <div class="panel">
      <h3 style="margin:0 0 10px;font-size:.96rem;font-weight:900;">➕ 감사 점검 메모 / 이벤트 수동 기록</h3>
      <form id="auditForm" class="form-row">
        <select id="auditType">
          <option value="재무/전표">💰 재무/전표 점검</option>
          <option value="권한/RBAC">🔒 권한/RBAC 변경</option>
          <option value="세무/VAT">🧾 Hóa đơn VAT 검수</option>
          <option value="정산/재고">📦 정산·재고 실사</option>
        </select>
        <input type="text" id="auditDetail" placeholder="예: 11월 4주차 시재 및 VAT 영수증 대조 완료" required />
        <button type="submit" class="btn">기록 저장</button>
      </form>
    </div>

    <div class="panel">
      <h3 style="margin:0 0 10px;font-size:.96rem;font-weight:900;">📋 실시간 감사 이력</h3>
      <div id="auditList" style="color:#64748b;font-size:.86rem;padding:16px;text-align:center;">감사 로그를 불러오는 중...</div>
    </div>
  </main>

  <script type="module">
    import { checkAdminAuth } from '../assets/js/auth.js';
    import { getCurrentStoreInfo, loadDynamicTenants } from '../assets/js/tenant-router.js';
    import { db } from '../assets/js/firebase-config.js';
    import { collection, getDocs, addDoc, serverTimestamp, query, orderBy } from 'firebase/firestore';

    let _storeId = '';
    let _actor = '';
    const esc = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    async function loadLogs() {
      const box = document.getElementById('auditList');
      const snap = await getDocs(query(collection(db, 'merchants', _storeId, 'audit_logs'), orderBy('createdAt', 'desc'))).catch(() =>
        getDocs(collection(db, 'merchants', _storeId, 'audit_logs'))
      );
      const rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (!rows.length) {
        box.innerHTML = '<div style="padding:24px;text-align:center;color:#64748b;">기록된 감사 로그가 없습니다.</div>';
        return;
      }
      box.innerHTML = rows.map((r) => `
        <div class="log-row">
          <div>
            <span class="badge">${esc(r.type)}</span>
            <strong style="margin-left:6px;color:#0f172a;">${esc(r.detail)}</strong>
          </div>
          <div style="font-size:.78rem;color:#64748b;">${esc(r.actor)} · ${esc(r.timestampStr || '')}</div>
        </div>
      `).join('');
    }

    document.getElementById('auditForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!_storeId) return;
      await addDoc(collection(db, 'merchants', _storeId, 'audit_logs'), {
        type: document.getElementById('auditType').value,
        detail: document.getElementById('auditDetail').value.trim(),
        actor: _actor,
        timestampStr: new Date().toLocaleString('ko-KR'),
        createdAt: serverTimestamp()
      });
      e.target.reset();
      await loadLogs();
    });

    checkAdminAuth(
      async (user) => {
        _actor = user.email || '관리자';
        await loadDynamicTenants();
        const info = getCurrentStoreInfo();
        _storeId = String(window.tenantId || info?.storeId || info?.merchantId || '1791002036');
        document.getElementById('storeBadge').textContent = `🏪 ${info?.name || _storeId} (${_storeId})`;
        await loadLogs();
      },
      () => { location.href = '../login.html?redirect=' + encodeURIComponent(location.pathname); }
    );
  </script>
</body>
</html>
