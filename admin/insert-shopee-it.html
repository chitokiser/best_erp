        btn.addEventListener('click', async () => {
            btn.disabled = true;
            btn.textContent = "Shopee 연동 데이터 생성 중...";

            for (let i = 0; i < shopeeItems.length; i++) {
                const item = shopeeItems[i];

                const payload = {
                    name: item.name || item.기name, // fallback handling
                    brand: item.brand,
                    categoryId: item.cat,
                    specification: "Shopee VN 연동 가상데이터",
                    materialCode: "SHP-" + (Math.floor(Math.random() * 90000) + 10000),
                    unit: "EA",
                    applications: ["마감", "내장", "기타"],
                    ourPurchasePrice: item.price
                };

                try {
                    await createMaterial(payload, null);
                    log(`[${i + 1}/40] 성공: ${payload.name} 등록 완료 (Shopee 예상단가: ${item.price.toLocaleString()} VND)`);
                } catch (e) {
                    log(`[${i + 1}/40] 실패: ${payload.name} - ${e.message}`);
                }
            }

            log("✔️ Shopee VN IT/사무기기 샘플 40종 생성이 완료되었습니다!");
            btn.textContent = "생성 완료";
        });
