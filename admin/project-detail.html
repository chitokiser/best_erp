<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로젝트 상세 - BESTwinner</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .kanban-board {
            display: flex;
            gap: 1.5rem;
            margin-top: 1.5rem;
            padding-bottom: 1rem;
        }

        .kanban-column {
            flex: 1;
            min-width: 250px;
            background: #f8fafc;
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-height: 400px;
            transition: background 0.2s;
        }

        .kanban-column.drag-over {
            background: #e2e8f0;
        }

        .kanban-column h3 {
            font-size: 1rem;
            color: var(--text-secondary);
            margin: 0;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .kanban-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 1rem;
            position: relative;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            cursor: grab;
            transition: box-shadow 0.2s;
        }

        .kanban-card:active {
            cursor: grabbing;
        }

        .card-actions {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            display: flex;
            gap: 0.25rem;
        }

        .card-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0.2rem;
            filter: grayscale(1);
        }

        .card-actions button:hover {
            filter: grayscale(0);
        }

        .task-tag {
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background: #dbeafe;
            color: #1e40af;
            display: inline-block;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body style="display: none;">
    <header class="main-header">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <h1 class="logo">BESTwinner</h1>
            <nav class="main-nav">
                <ul>
                    <li><a href="dashboard.html">대시보드</a></li>
                    <li><a href="projects.html" style="color:var(--primary-color)">프로젝트</a></li>
                    <li><a href="materials.html">자재관리</a></li>
                    <li><a href="users.html">권한관리</a></li>
                    <li id="navUserEmail"></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container" style="padding: 2rem 1rem;">
        <!-- Project Header -->
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem;">
            <div>
                <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem;">
                    <span id="projectStatusBadge"
                        style="background: #10b981; color: white; padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.8rem; font-weight: bold;">로딩
                        중...</span>
                    <span id="projectPmBadge" style="color: var(--text-secondary); font-size: 0.875rem;">PM: 불러오는
                        중...</span>
                </div>
                <h2 id="projectTitleHeader" style="margin: 0; font-size: 1.8rem;">프로젝트 정보를 불러오는 중입니다...</h2>
            </div>
            <div style="text-align: right;">
                <p style="margin: 0 0 0.5rem 0; font-size: 0.875rem; color: var(--text-secondary);">전체 진척도 (<span
                        id="progressText">0</span>%)</p>
                <div style="width: 250px; background: #e2e8f0; height: 10px; border-radius: 5px; overflow: hidden;">
                    <div id="progressBar"
                        style="background: var(--primary-color); width: 0%; height: 100%; transition: width 0.3s;">
                    </div>
                </div>
            </div>
        </div>

        <hr style="border: none; border-top: 1px solid #e2e8f0; margin-bottom: 2rem;">

        <!-- Tabs -->
        <div style="display: flex; gap: 2rem; border-bottom: 2px solid #e2e8f0; margin-bottom: 2rem; font-weight: 500;">
            <div id="tab-kanban" onclick="window.switchTab('kanban')"
                style="padding-bottom: 0.75rem; border-bottom: 2px solid var(--primary-color); color: var(--primary-color); cursor: pointer;">
                칸반 보드 (Task)</div>
            <div id="tab-files" onclick="window.switchTab('files')"
                style="padding-bottom: 0.75rem; color: var(--text-secondary); cursor: pointer;">
                결재 및 도면 자료</div>
        </div>

        <!-- Kanban View -->
        <div id="view-kanban">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; font-size: 1.25rem;">업무 현황 (공정 관리)</h3>
                <button class="btn-primary" style="padding: 0.5rem 1rem;" onclick="window.addKanbanTask()">+ 새 태스크
                    추가</button>
            </div>

            <div class="kanban-board">
                <div class="kanban-column" id="todo" ondragenter="window.allowDrop(event)"
                    ondragover="window.allowDrop(event)" ondragleave="window.dragLeave(event)"
                    ondrop="window.drop(event, this)">
                    <h3>할 일 (To Do) <span class="task-count">0</span></h3>
                </div>
                <div class="kanban-column" id="in_progress" ondragenter="window.allowDrop(event)"
                    ondragover="window.allowDrop(event)" ondragleave="window.dragLeave(event)"
                    ondrop="window.drop(event, this)">
                    <h3>진행 중 (In Progress) <span class="task-count">0</span></h3>
                </div>
                <div class="kanban-column" id="waiting" ondragenter="window.allowDrop(event)"
                    ondragover="window.allowDrop(event)" ondragleave="window.dragLeave(event)"
                    ondrop="window.drop(event, this)">
                    <h3>협력사 대기 (Waiting) <span class="task-count">0</span></h3>
                </div>
                <div class="kanban-column" id="done" ondragenter="window.allowDrop(event)"
                    ondragover="window.allowDrop(event)" ondragleave="window.dragLeave(event)"
                    ondrop="window.drop(event, this)">
                    <h3>완료 (Done) <span class="task-count">0</span></h3>
                </div>
            </div>
        </div>

        <!-- Files View -->
        <div id="view-files" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3 style="margin: 0; font-size: 1.25rem;">결재문서 및 도면 자료실</h3>
                <div>
                    <input type="file" id="fileUploadInput" style="display: none;"
                        onchange="window.handleFileUpload(event)">
                    <button class="btn-primary" style="padding: 0.5rem 1rem;"
                        onclick="document.getElementById('fileUploadInput').click()">+ 자료 업로드</button>
                </div>
            </div>

            <div class="card">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 2px solid var(--border-color);">
                            <th style="padding: 1rem;">자료 명</th>
                            <th style="padding: 1rem;">작성자</th>
                            <th style="padding: 1rem;">다운로드</th>
                            <th style="padding: 1rem;">관리</th>
                        </tr>
                    </thead>
                    <tbody id="filesTableBody">
                        <tr>
                            <td colspan="4" style="text-align:center; padding:1rem; color:var(--text-secondary);">등록된
                                자료가 없습니다.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- App Logic -->
    <script type="module">
        import { checkAdminAuth, logoutAdmin } from '../assets/js/auth.js';
        import { db } from '../assets/js/firebase-config.js';
        import { doc, getDoc, collection, addDoc, getDocs, updateDoc, deleteDoc, serverTimestamp } from 'firebase/firestore';

        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        window.logoutAndRedirect = () => { logoutAdmin(); };
        window.draggedCardId = null;
        window.currentUserEmail = 'Unknown';

        window.switchTab = (tab) => {
            document.getElementById('view-kanban').style.display = tab === 'kanban' ? 'block' : 'none';
            document.getElementById('view-files').style.display = tab === 'files' ? 'block' : 'none';

            ['kanban', 'files'].forEach(t => {
                const el = document.getElementById('tab-' + t);
                if (el) {
                    if (t === tab) {
                        el.style.color = 'var(--primary-color)';
                        el.style.borderBottom = '2px solid var(--primary-color)';
                    } else {
                        el.style.color = 'var(--text-secondary)';
                        el.style.borderBottom = 'none';
                    }
                }
            });

            if (tab === 'files') window.loadFiles();
        };

        async function loadProjectDetails() {
            if (!projectId) return;
            const snap = await getDoc(doc(db, 'projects', projectId));
            if (snap.exists()) {
                const data = snap.data();
                document.getElementById('projectTitleHeader').textContent = data.title;
                document.getElementById('projectPmBadge').textContent = 'PM: ' + (data.pm || '미배정');
                document.getElementById('projectStatusBadge').textContent = data.status || '진행 중';
            }
        }

        async function loadTasks() {
            if (!projectId) return;
            ['todo', 'in_progress', 'waiting', 'done'].forEach(id => {
                const col = document.getElementById(id);
                Array.from(col.children).forEach(c => { if (c.tagName !== 'H3') col.removeChild(c); });
            });

            const snap = await getDocs(collection(db, 'projects', projectId, 'tasks'));
            let doneCount = 0;

            snap.forEach(docSnap => {
                const data = docSnap.data();
                const status = data.status || 'todo';
                if (status === 'done') doneCount++;
                renderCard(docSnap.id, data, status);
            });

            const prog = snap.size === 0 ? 0 : Math.round((doneCount / snap.size) * 100);
            document.getElementById('progressText').textContent = prog;
            document.getElementById('progressBar').style.width = prog + '%';
            updateCounts();
        }

        window.addKanbanTask = async () => {
            const title = prompt("새 태스크 제목:");
            if (!title) return;
            const desc = prompt("설명 기재:");
            await addDoc(collection(db, 'projects', projectId, 'tasks'), {
                title, description: desc || '', status: 'todo', tag: '신규'
            });
            loadTasks();
        };

        window.editTask = async (id, oldT, oldD) => {
            const nt = prompt("제목:", oldT); if (!nt) return;
            const nd = prompt("설명:", oldD);
            await updateDoc(doc(db, 'projects', projectId, 'tasks', id), { title: nt, description: nd });
            loadTasks();
        };

        window.delTask = async (id) => {
            if (confirm("삭제하시겠습니까?")) {
                await deleteDoc(doc(db, 'projects', projectId, 'tasks', id));
                loadTasks();
            }
        };

        function renderCard(id, data, statusCol) {
            const col = document.getElementById(statusCol);
            if (!col) return;
            const card = document.createElement('div');
            card.className = 'kanban-card'; card.draggable = true; card.id = id;

            card.addEventListener('dragstart', (e) => {
                window.draggedCardId = id;
                e.dataTransfer.setData("text", id);
            });
            card.addEventListener('dragend', () => { window.draggedCardId = null; });

            card.innerHTML = `
                <div class="card-actions">
                    <button onclick="window.editTask('${id}', '${data.title}', '${data.description}')">✏️</button>
                    <button onclick="window.delTask('${id}')">🗑️</button>
                </div>
                <span class="task-tag">${data.tag || '일반'}</span>
                <h4 style="margin:0 0 0.5rem 0; font-size:1rem; padding-right:2rem;">${data.title}</h4>
                <p style="margin:0; font-size:0.8rem; color:gray;">${data.description}</p>
            `;
            col.appendChild(card);
        }

        window.allowDrop = (ev) => {
            ev.preventDefault();
            const targetCol = ev.target.closest('.kanban-column');
            if (targetCol) targetCol.classList.add('drag-over');
        };

        window.dragLeave = (ev) => {
            const targetCol = ev.target.closest('.kanban-column');
            if (targetCol) targetCol.classList.remove('drag-over');
        };

        window.drop = async (ev, columnElement) => {
            ev.preventDefault();
            const targetCol = ev.target.closest('.kanban-column');
            if (targetCol) targetCol.classList.remove('drag-over');

            const id = window.draggedCardId;
            if (!id || !targetCol) return;

            const card = document.getElementById(id);
            if (card) targetCol.appendChild(card);

            updateCounts();
            await updateDoc(doc(db, 'projects', projectId, 'tasks', id), { status: targetCol.id });
            loadTasks();
        };

        function updateCounts() {
            ['todo', 'in_progress', 'waiting', 'done'].forEach(colId => {
                const col = document.getElementById(colId);
                const count = col.querySelectorAll('.kanban-card').length;
                const span = col.querySelector('.task-count');
                if (span) span.textContent = count;
            });
        }

        // Files Logic
        window.handleFileUpload = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            alert(`[업로드 시뮬레이션]\n\n파일명: ${file.name}\nFirebase Storage 보안 규칙을 우회하여 DB 메타데이터로 안전하게 가상 업로드합니다.`);
            await addDoc(collection(db, 'projects', projectId, 'files'), {
                name: file.name, uploader: window.currentUserEmail, url: '#', createdAt: serverTimestamp()
            });
            e.target.value = '';
            window.loadFiles();
        };

        window.loadFiles = async () => {
            const tbody = document.getElementById('filesTableBody');
            const snap = await getDocs(collection(db, 'projects', projectId, 'files'));
            if (snap.empty) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:1rem; color:var(--text-secondary);">등록된 자료가 없습니다.</td></tr>';
                return;
            }
            let html = '';
            snap.forEach(d => {
                const data = d.data();
                html += `
                    <tr>
                        <td style="padding: 1rem; font-weight: 500;">📄 ${data.name || '알 수 없는 파일'}</td>
                        <td style="padding: 1rem;">${data.uploader || '알 수 없음'}</td>
                        <td style="padding: 1rem;"><a href="${data.url}" onclick="alert('다운로드 데모입니다.')" style="color:var(--primary-color);">다운로드</a></td>
                        <td style="padding: 1rem;"><button class="btn-primary" style="background:#ef4444; padding:0.25rem 0.5rem;" onclick="window.delFile('${d.id}')">삭제</button></td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        };

        window.delFile = async (id) => {
            if (confirm("이 자료를 삭제하시겠습니까?")) {
                await deleteDoc(doc(db, 'projects', projectId, 'files', id));
                window.loadFiles();
            }
        };

        checkAdminAuth((user) => {
            document.body.style.display = 'block';
            window.currentUserEmail = user.email;
            if (projectId) { loadProjectDetails(); loadTasks(); }
        }, () => { window.location.href = '../login.html'; });
    </script>
</body>

</html>
