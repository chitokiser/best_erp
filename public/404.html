<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이지를 찾을 수 없습니다 | BestERP · CRM M-SaaS</title>
  <meta name="theme-color" content="#0b1120" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Pretendard Variable','Pretendard',-apple-system,sans-serif;
      background:#0b1120;
      color:#f8fafc;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      text-align:center;
      word-break:keep-all;
    }
    .card {
      max-width:460px;
      width:100%;
      background:#111827;
      border:1px solid rgba(148,163,184,.2);
      border-radius:22px;
      padding:36px 26px;
    }
    .code { font-size:3rem; font-weight:900; color:#fde047; line-height:1; margin-bottom:10px; }
    h1 { font-size:1.3rem; font-weight:900; margin-bottom:8px; }
    p { font-size:.9rem; color:#94a3b8; margin-bottom:24px; }
    .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    a {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:11px 18px;
      border-radius:11px;
      font-weight:800;
      font-size:.88rem;
      text-decoration:none;
    }
    .primary { background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; }
    .ghost { background:rgba(255,255,255,.06); color:#e2e8f0; border:1px solid rgba(148,163,184,.22); }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>요청하신 페이지를 찾을 수 없습니다</h1>
    <p>주소가 변경되었거나 삭제된 페이지입니다. 아래 버튼으로 BestERP 홈 또는 가맹점 대시보드로 이동해 주세요.</p>
    <div class="btns">
      <a href="/" class="primary">🏢 BestERP 홈으로</a>
      <a href="/login.html" class="ghost">🔐 가맹점 로그인</a>
    </div>
  </main>
</body>
</html>
